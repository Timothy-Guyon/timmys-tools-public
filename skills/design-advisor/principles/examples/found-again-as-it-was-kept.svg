<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Found again as it was kept: A notes app&#x27;s search for vehicle</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A notes app&#x27;s search for vehicle</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="200" height="30" rx="10" fill="#f2f2f7"/>
  <text x="60" y="84" font-size="13" fill="#1c1c1e">vehicle</text>
  <text x="54" y="124" font-size="14" fill="#1c1c1e">Car repair</text>
  <text x="54" y="139" font-size="11" fill="#8e8e93">Garage booked for Tuesday</text>
  <line x1="40" y1="146" x2="260" y2="146" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="64" width="200" height="30" rx="10" fill="#f2f2f7"/>
  <text x="320" y="84" font-size="13" fill="#1c1c1e">vehicle</text>
  <text x="410" y="150" font-size="13" text-anchor="middle" fill="#8e8e93">No results</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: finds the Car repair note</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: exact title words only, nothing found</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One name per thing: A recipe app&#x27;s saved recipes, on three screens</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A recipe app&#x27;s saved recipes, on three screens</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="86" font-size="11" fill="#8e8e93">Tab bar</text>
  <rect x="54" y="94" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="64" y="114" font-size="13" fill="#1c1c1e">♥ Favourites</text>
  <text x="54" y="140" font-size="11" fill="#8e8e93">Recipe page</text>
  <rect x="54" y="148" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="64" y="168" font-size="13" fill="#1c1c1e">♥ Favourites</text>
  <text x="54" y="194" font-size="11" fill="#8e8e93">Settings</text>
  <rect x="54" y="202" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="64" y="222" font-size="13" fill="#1c1c1e">♥ Favourites</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="86" font-size="11" fill="#8e8e93">Tab bar</text>
  <rect x="314" y="94" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="324" y="114" font-size="13" fill="#1c1c1e">♥ Favourites</text>
  <text x="314" y="140" font-size="11" fill="#8e8e93">Recipe page</text>
  <rect x="314" y="148" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="324" y="168" font-size="13" fill="#d70015">♥ Saved</text>
  <text x="314" y="194" font-size="11" fill="#8e8e93">Settings</text>
  <rect x="314" y="202" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <text x="324" y="222" font-size="13" fill="#d70015">♥ Bookmarks</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Favourites everywhere</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: Favourites, Saved and Bookmarks</text>
</svg>

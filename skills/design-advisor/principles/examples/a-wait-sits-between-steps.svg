<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A wait sits between steps: A hotel search where availability takes 4 seconds</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A hotel search where availability takes 4 seconds</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="60" font-size="11" fill="#8e8e93">Arrival</text>
  <rect x="54" y="65" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="85" font-size="13" fill="#1c1c1e">12 Dec</text>
  <text x="54" y="110" font-size="11" fill="#8e8e93">Departure</text>
  <rect x="54" y="115" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="135" font-size="13" fill="#1c1c1e">14 Dec</text>
  <text x="54" y="160" font-size="11" fill="#8e8e93">Guests</text>
  <rect x="54" y="165" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="185" font-size="13" fill="#1c1c1e">2</text>
  <rect x="54" y="208" width="192" height="30" rx="10" fill="#007aff"/>
  <text x="150" y="228.04" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Search</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="60" font-size="11" fill="#8e8e93">Arrival</text>
  <rect x="314" y="65" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="85" font-size="13" fill="#1c1c1e">12 Dec</text>
  <text x="314" y="110" font-size="11" fill="#8e8e93">Departure</text>
  <rect x="314" y="115" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="160" font-size="11" fill="#8e8e93">Guests</text>
  <rect x="314" y="165" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="102" width="220" height="144" fill="rgb(255 255 255 / 0.8)"/>
  <circle cx="410" cy="170" r="12" fill="none" stroke="#8e8e93" stroke-width="3" stroke-dasharray="15 8"/>
  <text x="410" y="204" font-size="11" text-anchor="middle" fill="#8e8e93">Checking availability…</text>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: the check runs after Search</text>
  <text x="410" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d70015">Fail: freezes after the arrival date</text>
</svg>

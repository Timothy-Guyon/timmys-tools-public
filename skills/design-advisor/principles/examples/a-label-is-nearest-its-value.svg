<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A label is nearest its value: A loan calculator&#x27;s results</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A loan calculator&#x27;s results</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your loan</text>
  <text x="54" y="116" font-size="12" fill="#8e8e93">Monthly payment</text>
  <text x="246" y="116" font-size="14" text-anchor="end" font-weight="600" fill="#1c1c1e">£820</text>
  <text x="54" y="150" font-size="12" fill="#8e8e93">Total interest</text>
  <text x="246" y="150" font-size="14" text-anchor="end" font-weight="600" fill="#1c1c1e">£4,100</text>
  <text x="54" y="184" font-size="12" fill="#8e8e93">Term</text>
  <text x="246" y="184" font-size="14" text-anchor="end" font-weight="600" fill="#1c1c1e">5 years</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your loan</text>
  <text x="314" y="108" font-size="16" font-weight="600" fill="#1c1c1e">£820</text>
  <text x="314" y="126" font-size="10" fill="#8e8e93">Monthly payment</text>
  <text x="314" y="152" font-size="16" font-weight="600" fill="#1c1c1e">£4,100</text>
  <text x="314" y="170" font-size="10" fill="#8e8e93">Total interest</text>
  <text x="314" y="196" font-size="16" font-weight="600" fill="#1c1c1e">5 years</text>
  <text x="314" y="214" font-size="10" fill="#8e8e93">Term</text>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: each label just left of its amount</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: labels under amounts, as near the next</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Complex, not confusing: A car&#x27;s climate screen with fourteen controls</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A car&#x27;s climate screen with fourteen controls</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <text x="80" y="74" font-size="11" text-anchor="middle" fill="#aeaeb2">Driver</text>
  <rect x="48" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="82" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="48" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="82" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="48" y="156" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <text x="150" y="74" font-size="11" text-anchor="middle" fill="#aeaeb2">Fan</text>
  <rect x="118" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="152" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="118" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="152" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <text x="220" y="74" font-size="11" text-anchor="middle" fill="#aeaeb2">Passenger</text>
  <rect x="188" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="222" y="84" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="188" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="222" y="120" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <rect x="188" y="156" width="30" height="30" rx="6" fill="#3a3a3c"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="312" y="74" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="352" y="74" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="392" y="74" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="432" y="74" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="472" y="74" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="312" y="118" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="352" y="118" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="392" y="118" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="432" y="118" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="472" y="118" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="312" y="162" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="352" y="162" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="392" y="162" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <rect x="432" y="162" width="34" height="34" rx="6" fill="#3a3a3c"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: labelled groups, Driver, Passenger, Fan</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: one unlabelled grid</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Something to read before everything is ready: A news app&#x27;s front page, still loading pictures</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A news app&#x27;s front page, still loading pictures</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <rect x="54" y="96" width="44" height="36" rx="4" fill="#e5e5ea"/>
  <text x="108" y="118" font-size="12" font-weight="600" fill="#1c1c1e">Rates held at 4%</text>
  <rect x="54" y="144" width="44" height="36" rx="4" fill="#e5e5ea"/>
  <text x="108" y="166" font-size="12" font-weight="600" fill="#1c1c1e">Storm heads north</text>
  <rect x="54" y="192" width="44" height="36" rx="4" fill="#e5e5ea"/>
  <text x="108" y="214" font-size="12" font-weight="600" fill="#1c1c1e">Cup final tonight</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="410" cy="148" r="12" fill="none" stroke="#d1d1d6" stroke-width="3" stroke-dasharray="15 8"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: headlines at once, pictures fill in</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: blank until everything loads</text>
</svg>

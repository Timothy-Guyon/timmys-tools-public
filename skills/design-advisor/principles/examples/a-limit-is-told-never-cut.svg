<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A limit is told, never cut: A marketplace description, 500-character limit, 540 pasted</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A marketplace description, 500-character limit, 540 pasted</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Item description</text>
  <rect x="54" y="96" width="192" height="100" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <line x1="62" y1="112" x2="238" y2="112" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="62" y1="128" x2="238" y2="128" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="62" y1="144" x2="238" y2="144" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="62" y1="160" x2="238" y2="160" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="62" y1="176" x2="238" y2="176" stroke="#d1d1d6" stroke-width="6"/>
  <text x="54" y="216" font-size="11" fill="#d70015">40 characters too many</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Item description</text>
  <rect x="314" y="96" width="192" height="100" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="322" y1="112" x2="498" y2="112" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="322" y1="128" x2="498" y2="128" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="322" y1="144" x2="498" y2="144" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="322" y1="160" x2="498" y2="160" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="322" y1="176" x2="420" y2="176" stroke="#d1d1d6" stroke-width="6"/>
  <text x="314" y="216" font-size="11" fill="#8e8e93">500 / 500</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: kept whole, 40 too many shown</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: silently cut at 500</text>
</svg>

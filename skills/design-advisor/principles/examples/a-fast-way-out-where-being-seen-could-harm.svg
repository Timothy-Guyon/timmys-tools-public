<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A fast way out where being seen could harm: A sexual health clinic&#x27;s booking app</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A sexual health clinic&#x27;s booking app</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Book a test</text>
  <rect x="202" y="56" width="50" height="24" rx="6" fill="#ff3b30"/>
  <text x="227" y="71.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Exit</text>
  <text x="54" y="100" font-size="11" fill="#8e8e93">Date</text>
  <rect x="54" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="150" font-size="11" fill="#8e8e93">Clinic</text>
  <rect x="54" y="155" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Book a test</text>
  <text x="310" y="73" font-size="13" fill="#007aff">☰</text>
  <text x="314" y="100" font-size="11" fill="#8e8e93">Date</text>
  <rect x="314" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="150" font-size="11" fill="#8e8e93">Clinic</text>
  <rect x="314" y="155" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="86" width="120" height="160" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="312" y="112" font-size="12" fill="#1c1c1e">Home</text>
  <text x="312" y="140" font-size="12" fill="#1c1c1e">Results</text>
  <text x="312" y="168" font-size="12" fill="#1c1c1e">Settings ›</text>
  <text x="322" y="196" font-size="11" fill="#8e8e93">Exit app</text>
  <rect x="314" y="182" width="90" height="20" rx="4" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: Exit on every screen opens a weather page</text>
  <text x="410" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d70015">Fail: exit two taps deep in the menu</text>
</svg>

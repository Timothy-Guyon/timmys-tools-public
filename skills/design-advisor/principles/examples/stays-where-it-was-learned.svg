<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Stays where it was learned: A phone dialer after an update</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A phone dialer after an update</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="106" cy="80" r="15" fill="#f2f2f7"/>
  <text x="106" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">1</text>
  <circle cx="150" cy="80" r="15" fill="#f2f2f7"/>
  <text x="150" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">2</text>
  <circle cx="194" cy="80" r="15" fill="#f2f2f7"/>
  <text x="194" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">3</text>
  <circle cx="106" cy="116" r="15" fill="#f2f2f7"/>
  <text x="106" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">4</text>
  <circle cx="150" cy="116" r="15" fill="#f2f2f7"/>
  <text x="150" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">5</text>
  <circle cx="194" cy="116" r="15" fill="#f2f2f7"/>
  <text x="194" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">6</text>
  <circle cx="106" cy="152" r="15" fill="#f2f2f7"/>
  <text x="106" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">7</text>
  <circle cx="150" cy="152" r="15" fill="#f2f2f7"/>
  <text x="150" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">8</text>
  <circle cx="194" cy="152" r="15" fill="#f2f2f7"/>
  <text x="194" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">9</text>
  <circle cx="150" cy="216" r="18" fill="#34c759"/>
  <text x="150" y="221" font-size="10" text-anchor="middle" font-weight="600" fill="#fff">Call</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="366" cy="80" r="15" fill="#f2f2f7"/>
  <text x="366" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">1</text>
  <circle cx="410" cy="80" r="15" fill="#f2f2f7"/>
  <text x="410" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">2</text>
  <circle cx="454" cy="80" r="15" fill="#f2f2f7"/>
  <text x="454" y="85" font-size="13" text-anchor="middle" fill="#1c1c1e">3</text>
  <circle cx="366" cy="116" r="15" fill="#f2f2f7"/>
  <text x="366" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">4</text>
  <circle cx="410" cy="116" r="15" fill="#f2f2f7"/>
  <text x="410" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">5</text>
  <circle cx="454" cy="116" r="15" fill="#f2f2f7"/>
  <text x="454" y="121" font-size="13" text-anchor="middle" fill="#1c1c1e">6</text>
  <circle cx="366" cy="152" r="15" fill="#f2f2f7"/>
  <text x="366" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">7</text>
  <circle cx="410" cy="152" r="15" fill="#f2f2f7"/>
  <text x="410" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">8</text>
  <circle cx="454" cy="152" r="15" fill="#f2f2f7"/>
  <text x="454" y="157" font-size="13" text-anchor="middle" fill="#1c1c1e">9</text>
  <circle cx="496" cy="72" r="14" fill="#34c759"/>
  <text x="496" y="76" font-size="8" text-anchor="middle" font-weight="600" fill="#fff">Call</text>
  <rect x="478" y="54" width="36" height="36" rx="18" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: Call stays bottom centre everywhere</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: Call moves to top right on the keypad</text>
</svg>

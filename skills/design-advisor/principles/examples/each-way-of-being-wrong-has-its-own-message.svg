<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Each way of being wrong has its own message: A flight booking&#x27;s travel date: 31 Feb, and empty</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A flight booking&#x27;s travel date: 31 Feb, and empty</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="60" font-size="11" fill="#8e8e93">Travel date</text>
  <rect x="54" y="65" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="62" y="85" font-size="13" fill="#1c1c1e">31/02/2027</text>
  <text x="54" y="109" font-size="11" fill="#d70015">Travel date must be a real date</text>
  <text x="54" y="140" font-size="11" fill="#8e8e93">Return date</text>
  <rect x="54" y="145" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="54" y="189" font-size="11" fill="#d70015">Enter a travel date</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="60" font-size="11" fill="#8e8e93">Travel date</text>
  <rect x="314" y="65" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="322" y="85" font-size="13" fill="#1c1c1e">31/02/2027</text>
  <text x="314" y="109" font-size="11" fill="#d70015">Invalid date</text>
  <text x="314" y="140" font-size="11" fill="#8e8e93">Return date</text>
  <rect x="314" y="145" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="314" y="189" font-size="11" fill="#d70015">Invalid date</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: a message for each mistake</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: Invalid date for both</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A suggestion&#x27;s reason is what the person did: A podcast app&#x27;s suggestion row</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A podcast app&#x27;s suggestion row</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">For you</text>
  <text x="54" y="110" font-size="11" fill="#8e8e93">Because you listened to</text>
  <text x="54" y="126" font-size="13" font-weight="600" fill="#1c1c1e">The History Hour</text>
  <rect x="54" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <rect x="120" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <rect x="186" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">For you</text>
  <text x="314" y="110" font-size="11" fill="#8e8e93">Because you love</text>
  <text x="314" y="126" font-size="13" font-weight="600" fill="#1c1c1e">war stories</text>
  <rect x="314" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <rect x="380" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <rect x="446" y="140" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Because you listened to…</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: Because you love war stories</text>
</svg>

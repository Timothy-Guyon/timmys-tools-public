<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A rating scale of about seven points: A restaurant review app, rating a meal</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A restaurant review app, rating a meal</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Rate your meal</text>
  <text x="150" y="154" font-size="30" text-anchor="middle" fill="#ff9f0a">★★★★☆</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Rate your meal</text>
  <line x1="314" y1="146" x2="506" y2="146" stroke="#e5e5ea" stroke-width="6"/>
  <line x1="314" y1="146" x2="454" y2="146" stroke="#007aff" stroke-width="6"/>
  <circle cx="454" cy="146" r="11" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="454" y="126" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">73</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: 1 to 5 stars</text>
  <text x="410" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#d70015">Fail: a 0 to 100 slider, 73 vs 74</text>
</svg>

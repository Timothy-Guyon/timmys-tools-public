<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The loose end is the app&#x27;s: A car-sharing app&#x27;s End Rental</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A car-sharing app&#x27;s End Rental</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Rental ended</text>
  <rect x="100" y="100" width="100" height="50" rx="12" fill="#e5e5ea"/>
  <text x="150" y="130" font-size="12" text-anchor="middle" fill="#8e8e93">Car</text>
  <text x="150" y="180" font-size="14" text-anchor="middle" font-weight="600" fill="#248a3d">Car locked</text>
  <text x="150" y="200" font-size="11" text-anchor="middle" fill="#8e8e93">You can walk away</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Rental ended</text>
  <rect x="360" y="100" width="100" height="50" rx="12" fill="#e5e5ea"/>
  <text x="410" y="130" font-size="12" text-anchor="middle" fill="#8e8e93">Car</text>
  <text x="410" y="180" font-size="14" text-anchor="middle" font-weight="600" fill="#d70015">Car unlocked</text>
  <rect x="360" y="196" width="100" height="30" rx="10" fill="#f2f2f7"/>
  <text x="410" y="215.32" font-size="12" text-anchor="middle" font-weight="600" fill="#007aff">Lock</text>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#248a3d">Pass: ending the rental locks the car</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: car left unlocked unless Lock is tapped</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A picture alone only where it is known: A smart lights app&#x27;s bottom bar</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A smart lights app&#x27;s bottom bar</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="190" width="220" height="56" fill="#f9f9f9"/>
  <line x1="40" y1="190" x2="260" y2="190" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="110" cy="210" r="7" fill="none" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="110" y="236" font-size="10" text-anchor="middle" fill="#1c1c1e">Lights</text>
  <text x="190" y="216" font-size="18" text-anchor="middle" fill="#007aff">✦</text>
  <text x="190" y="236" font-size="10" text-anchor="middle" fill="#007aff">Scenes</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="190" width="220" height="56" fill="#f9f9f9"/>
  <line x1="300" y1="190" x2="520" y2="190" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="370" cy="210" r="7" fill="none" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="370" y="236" font-size="10" text-anchor="middle" fill="#1c1c1e">Lights</text>
  <text x="450" y="216" font-size="18" text-anchor="middle" fill="#007aff">✦</text>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: sparkle icon carries the word Scenes</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: sparkle icon with no word</text>
</svg>

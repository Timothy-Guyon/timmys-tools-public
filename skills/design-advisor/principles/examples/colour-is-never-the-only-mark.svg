<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Colour is never the only mark: A calendar app&#x27;s event list with a declined event</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A calendar app&#x27;s event list with a declined event</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Tuesday</text>
  <rect x="50" y="94" width="4" height="30" fill="#007aff"/>
  <text x="62" y="114" font-size="13" fill="#1c1c1e">Team sync</text>
  <rect x="50" y="134" width="4" height="30" fill="#a8cdfa"/>
  <text x="62" y="154" font-size="13" fill="#8e8e93">Lunch with Jo</text>
  <line x1="62" y1="149" x2="152" y2="149" stroke="#8e8e93" stroke-width="1"/>
  <text x="246" y="154" font-size="11" text-anchor="end" fill="#8e8e93">Declined</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Tuesday</text>
  <rect x="310" y="94" width="4" height="30" fill="#007aff"/>
  <text x="322" y="114" font-size="13" fill="#1c1c1e">Team sync</text>
  <rect x="310" y="134" width="4" height="30" fill="#a8cdfa"/>
  <text x="322" y="154" font-size="13" fill="#5b8fd6">Lunch with Jo</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: grey, struck through, labelled Declined</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: just a paler colour</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A concept is added on evidence: A to-do app&#x27;s task details</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A to-do app&#x27;s task details</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Task</text>
  <text x="54" y="116" font-size="14" fill="#1c1c1e">Pay rent</text>
  <line x1="40" y1="128" x2="260" y2="128" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="154" font-size="12" fill="#8e8e93">Priority</text>
  <rect x="54" y="162" width="192" height="30" rx="8" fill="#f2f2f7"/>
  <rect x="56" y="164" width="94" height="26" rx="7" fill="#ffffff"/>
  <text x="103" y="182" font-size="13" text-anchor="middle" fill="#1c1c1e">Normal</text>
  <text x="197" y="182" font-size="13" text-anchor="middle" fill="#1c1c1e">High</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Task</text>
  <text x="314" y="116" font-size="14" fill="#1c1c1e">Pay rent</text>
  <line x1="300" y1="128" x2="520" y2="128" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="154" font-size="12" fill="#8e8e93">Priority (1–10)</text>
  <rect x="314" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322.5" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">1</text>
  <rect x="333.5" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="342" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">2</text>
  <rect x="353" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="361.5" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">3</text>
  <rect x="372.5" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="381" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">4</text>
  <rect x="392" y="162" width="17" height="24" rx="3" fill="#007aff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="400.5" y="179" font-size="10" text-anchor="middle" fill="#fff">5</text>
  <rect x="411.5" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="420" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">6</text>
  <rect x="431" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="439.5" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">7</text>
  <rect x="450.5" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="459" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">8</text>
  <rect x="470" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="478.5" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">9</text>
  <rect x="489.5" y="162" width="17" height="24" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="498" y="179" font-size="10" text-anchor="middle" fill="#1c1c1e">10</text>
  <text x="314" y="210" font-size="12" fill="#8e8e93">Urgency</text>
  <text x="506" y="210" font-size="12" text-anchor="end" fill="#007aff">Medium ›</text>
  <rect x="306" y="142" width="208" height="80" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Normal or High</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: 1 to 10, plus urgency, just in case</text>
</svg>

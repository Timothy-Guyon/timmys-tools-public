<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A guess is shown only as sure as it is: A banking app&#x27;s spending categories</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A banking app&#x27;s spending categories</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Spending</text>
  <text x="54" y="110" font-size="14" fill="#1c1c1e">Bean Coffee</text>
  <text x="54" y="125" font-size="11" fill="#8e8e93">Eating out</text>
  <line x1="40" y1="132" x2="260" y2="132" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="150" font-size="14" fill="#1c1c1e">ZXQ Trading</text>
  <text x="54" y="166" font-size="11" fill="#b25000">Shopping?</text>
  <text x="164" y="158" font-size="12" fill="#007aff">Yes</text>
  <text x="246" y="158" font-size="12" text-anchor="end" fill="#007aff">Change</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Spending</text>
  <text x="314" y="110" font-size="14" fill="#1c1c1e">Bean Coffee</text>
  <text x="314" y="125" font-size="11" fill="#8e8e93">Eating out</text>
  <line x1="300" y1="132" x2="520" y2="132" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="152" font-size="14" fill="#1c1c1e">ZXQ Trading</text>
  <text x="314" y="167" font-size="11" fill="#8e8e93">Shopping</text>
  <line x1="300" y1="174" x2="520" y2="174" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: unsure one asks Shopping?</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: unsure one filed as plainly as sure</text>
</svg>

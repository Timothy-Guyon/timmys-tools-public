<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An answer the app made can be checked where it stands: an airline assistant: How much can my bag weigh?</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">An airline assistant: How much can my bag weigh?</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="110" y="64" width="140" height="28" rx="14" fill="#007aff"/>
  <text x="120" y="82" font-size="11" fill="#fff">How much can my bag…</text>
  <rect x="50" y="102" width="170" height="56" rx="12" fill="#f2f2f7"/>
  <text x="60" y="124" font-size="13" font-weight="600" fill="#1c1c1e">23 kg per bag.</text>
  <text x="60" y="146" font-size="11" fill="#007aff">From: Baggage policy ›</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="370" y="64" width="140" height="28" rx="14" fill="#007aff"/>
  <text x="380" y="82" font-size="11" fill="#fff">How much can my bag…</text>
  <rect x="310" y="102" width="170" height="110" rx="12" fill="#f2f2f7"/>
  <text x="320" y="124" font-size="13" font-weight="600" fill="#1c1c1e">23 kg per bag.</text>
  <line x1="320" y1="142" x2="460" y2="142" stroke="#c7c7cc" stroke-width="6"/>
  <line x1="320" y1="156" x2="460" y2="156" stroke="#c7c7cc" stroke-width="6"/>
  <line x1="320" y1="170" x2="460" y2="170" stroke="#c7c7cc" stroke-width="6"/>
  <line x1="320" y1="184" x2="460" y2="184" stroke="#c7c7cc" stroke-width="6"/>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: answer with its source beneath</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: answer and a paragraph, no source</text>
</svg>

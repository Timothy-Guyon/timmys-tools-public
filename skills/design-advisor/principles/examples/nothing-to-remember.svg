<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Nothing to remember: A street-parking app&#x27;s zone screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A street-parking app&#x27;s zone screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <rect x="64" y="98" width="52" height="24" rx="12" fill="#fff" stroke="#007aff" stroke-width="1"/>
  <text x="90" y="113.96" font-size="11" text-anchor="middle" font-weight="600" fill="#007aff">4021</text>
  <rect x="164" y="108" width="52" height="24" rx="12" fill="#fff" stroke="#007aff" stroke-width="1"/>
  <text x="190" y="123.96" font-size="11" text-anchor="middle" font-weight="600" fill="#007aff">4022</text>
  <rect x="114" y="178" width="52" height="24" rx="12" fill="#fff" stroke="#007aff" stroke-width="1"/>
  <text x="140" y="193.96" font-size="11" text-anchor="middle" font-weight="600" fill="#007aff">4030</text>
  <circle cx="140" cy="146" r="6" fill="#007aff"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Parking zone</text>
  <text x="314" y="100" font-size="11" fill="#8e8e93">Zone code (on the street sign)</text>
  <rect x="314" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: nearby zones on a map, tap one</text>
  <text x="410" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#d70015">Fail: type a code read off a sign</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Few settings, none interacting: A camera app&#x27;s settings</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A camera app&#x27;s settings</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Camera settings</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Grid</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="206" y="95" width="40" height="24" rx="12" fill="#34c759"/>
  <circle cx="234" cy="107" r="10" fill="#ffffff"/>
  <text x="54" y="146" font-size="14" fill="#1c1c1e">Flash</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="206" y="129" width="40" height="24" rx="12" fill="#e5e5ea"/>
  <circle cx="218" cy="141" r="10" fill="#ffffff"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Camera settings</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">Grid</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="466" y="95" width="40" height="24" rx="12" fill="#34c759"/>
  <circle cx="494" cy="107" r="10" fill="#ffffff"/>
  <text x="314" y="146" font-size="14" fill="#1c1c1e">Flash</text>
  <line x1="300" y1="158" x2="520" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="466" y="129" width="40" height="24" rx="12" fill="#e5e5ea"/>
  <circle cx="478" cy="141" r="10" fill="#ffffff"/>
  <text x="314" y="177" font-size="12" fill="#1c1c1e">ISO</text>
  <text x="506" y="177" font-size="11" text-anchor="end" fill="#8e8e93">800</text>
  <line x1="300" y1="186" x2="520" y2="186" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="205" font-size="12" fill="#1c1c1e">Shutter</text>
  <text x="506" y="205" font-size="11" text-anchor="end" fill="#8e8e93">1/60</text>
  <line x1="300" y1="214" x2="520" y2="214" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="233" font-size="12" fill="#1c1c1e">Exposure</text>
  <text x="506" y="233" font-size="11" text-anchor="end" fill="#8e8e93">+0.7</text>
  <line x1="300" y1="242" x2="520" y2="242" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <path transform="translate(300 50)" d="M150 120 C 170 130, 170 150, 150 160 M150 150 C 170 160, 170 175, 150 186" fill="none" stroke="#ff3b30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#248a3d">Pass: Grid and Flash, each on its own</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: ISO, shutter, exposure change each other</text>
</svg>

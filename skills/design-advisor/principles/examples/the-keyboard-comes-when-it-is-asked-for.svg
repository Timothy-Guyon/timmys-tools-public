<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The keyboard comes when it is asked for: A hotel search screen as it opens</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A hotel search screen as it opens</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="60" font-size="11" fill="#8e8e93">Destination</text>
  <rect x="54" y="65" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="110" font-size="11" fill="#8e8e93">Dates</text>
  <rect x="54" y="115" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="135" font-size="13" fill="#1c1c1e">12 – 14 Dec</text>
  <text x="54" y="160" font-size="11" fill="#8e8e93">Guests</text>
  <rect x="54" y="165" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="185" font-size="13" fill="#1c1c1e">2</text>
  <!-- Fail -->

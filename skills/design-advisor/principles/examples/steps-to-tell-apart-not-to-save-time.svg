<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Steps to tell apart, not to save time: A clothes shop&#x27;s size picker</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A clothes shop&#x27;s size picker</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Size</text>
  <rect x="46" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="59.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">XS</text>
  <rect x="76" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="89.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">S</text>
  <rect x="106" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="119.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">M</text>
  <rect x="136" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="149.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">L</text>
  <rect x="166" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="179.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">XL</text>
  <rect x="196" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="209.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">2XL</text>
  <rect x="226" y="110" width="27" height="30" rx="6" fill="#f2f2f7"/>
  <text x="239.5" y="128.24" font-size="9" text-anchor="middle" fill="#1c1c1e">3XL</text>
  <text x="150" y="170" font-size="11" text-anchor="middle" fill="#8e8e93">XS to 3XL</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Size</text>
  <rect x="314" y="110" width="58" height="30" rx="6" fill="#f2f2f7"/>
  <text x="343" y="128.96" font-size="11" text-anchor="middle" fill="#1c1c1e">Small</text>
  <rect x="380" y="110" width="58" height="30" rx="6" fill="#f2f2f7"/>
  <text x="409" y="128.96" font-size="11" text-anchor="middle" fill="#1c1c1e">Medium</text>
  <rect x="446" y="110" width="58" height="30" rx="6" fill="#f2f2f7"/>
  <text x="475" y="128.96" font-size="11" text-anchor="middle" fill="#1c1c1e">Large</text>
  <text x="410" y="170" font-size="11" text-anchor="middle" fill="#d70015">then a second screen…</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: all eight sizes in one row</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: Small/Medium/Large, then exact size</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Done recedes, what is left stands out: A tax checklist, seven of nine done</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A tax checklist, seven of nine done</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="76" font-size="12" fill="#1c1c1e">Section 1</text>
  <text x="246" y="76" font-size="11" text-anchor="end" fill="#8e8e93">Completed</text>
  <text x="54" y="107" font-size="12" fill="#1c1c1e">Section 2</text>
  <text x="246" y="107" font-size="11" text-anchor="end" fill="#8e8e93">Completed</text>
  <text x="54" y="138" font-size="12" fill="#1c1c1e">Section 3</text>
  <text x="246" y="138" font-size="11" text-anchor="end" fill="#8e8e93">Completed</text>
  <text x="54" y="169" font-size="12" fill="#1c1c1e">Section 4</text>
  <text x="246" y="169" font-size="11" text-anchor="end" fill="#8e8e93">Completed</text>
  <text x="54" y="200" font-size="12" fill="#1c1c1e">Section 5</text>
  <rect x="166" y="186" width="82" height="20" rx="4" fill="#ffd60a"/>
  <text x="207" y="199.6" font-size="10" text-anchor="middle" font-weight="600" fill="#1c1c1e">In progress</text>
  <text x="54" y="231" font-size="12" fill="#1c1c1e">Section 6</text>
  <rect x="166" y="217" width="82" height="20" rx="4" fill="#ffd60a"/>
  <text x="207" y="230.6" font-size="10" text-anchor="middle" font-weight="600" fill="#1c1c1e">In progress</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="76" font-size="12" fill="#1c1c1e">Section 1</text>
  <rect x="426" y="62" width="82" height="20" rx="4" fill="#34c759"/>
  <text x="467" y="75.6" font-size="10" text-anchor="middle" font-weight="600" fill="#ffffff">Completed</text>
  <text x="314" y="107" font-size="12" fill="#1c1c1e">Section 2</text>
  <rect x="426" y="93" width="82" height="20" rx="4" fill="#34c759"/>
  <text x="467" y="106.6" font-size="10" text-anchor="middle" font-weight="600" fill="#ffffff">Completed</text>
  <text x="314" y="138" font-size="12" fill="#1c1c1e">Section 3</text>
  <rect x="426" y="124" width="82" height="20" rx="4" fill="#34c759"/>
  <text x="467" y="137.6" font-size="10" text-anchor="middle" font-weight="600" fill="#ffffff">Completed</text>
  <text x="314" y="169" font-size="12" fill="#1c1c1e">Section 4</text>
  <rect x="426" y="155" width="82" height="20" rx="4" fill="#34c759"/>
  <text x="467" y="168.6" font-size="10" text-anchor="middle" font-weight="600" fill="#ffffff">Completed</text>
  <text x="314" y="200" font-size="12" fill="#1c1c1e">Section 5</text>
  <rect x="426" y="186" width="82" height="20" rx="4" fill="#f2f2f7"/>
  <text x="467" y="199.6" font-size="10" text-anchor="middle" fill="#8e8e93">In progress</text>
  <text x="314" y="231" font-size="12" fill="#1c1c1e">Section 6</text>
  <rect x="426" y="217" width="82" height="20" rx="4" fill="#f2f2f7"/>
  <text x="467" y="230.6" font-size="10" text-anchor="middle" fill="#8e8e93">In progress</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: done in plain text, the two left stand out</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: bright green badges outshine the two</text>
</svg>

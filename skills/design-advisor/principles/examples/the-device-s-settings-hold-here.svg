<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The device&#x27;s settings hold here: A banking app at night, phone set to dark</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A banking app at night, phone set to dark</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="80" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Accounts</text>
  <text x="54" y="120" font-size="14" fill="#ffffff">Current</text>
  <text x="246" y="120" font-size="14" text-anchor="end" fill="#ffffff">£1,240</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="80" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Accounts</text>
  <text x="314" y="120" font-size="14" fill="#1c1c1e">Current</text>
  <text x="506" y="120" font-size="14" text-anchor="end" fill="#1c1c1e">£1,240</text>
  <text x="314" y="220" font-size="10" fill="#8e8e93">Settings › Display › Theme › Dark</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: turns dark with the phone</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: stays white, own Dark switch deep in menus</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A meaningful colour is strong, large and beside its contrast: A cinema ticket app&#x27;s progress bar</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A cinema ticket app&#x27;s progress bar</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Book tickets</text>
  <circle cx="70" cy="130" r="7" fill="#c7c7cc"/>
  <text x="70" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Film</text>
  <circle cx="123" cy="130" r="12" fill="#007aff"/>
  <text x="123" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Seats</text>
  <circle cx="176" cy="130" r="7" fill="#c7c7cc"/>
  <text x="176" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Pay</text>
  <circle cx="229" cy="130" r="7" fill="#c7c7cc"/>
  <text x="229" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Done</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Book tickets</text>
  <circle cx="330" cy="130" r="7" fill="#c7c7cc"/>
  <text x="330" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Film</text>
  <circle cx="383" cy="130" r="7" fill="#c7c7cc"/>
  <text x="383" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Seats</text>
  <circle cx="436" cy="130" r="7" fill="#c7c7cc"/>
  <text x="436" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Pay</text>
  <circle cx="489" cy="130" r="7" fill="#c7c7cc"/>
  <text x="489" y="160" font-size="11" text-anchor="middle" fill="#1c1c1e">Done</text>
  <line x1="366" y1="166" x2="400" y2="166" stroke="#fff3b0" stroke-width="2"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: big saturated blue dot beside greys</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: thin pale-yellow underline on white</text>
</svg>

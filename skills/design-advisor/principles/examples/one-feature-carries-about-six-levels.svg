<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One feature carries about six levels: A home energy app&#x27;s room usage map</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A home energy app&#x27;s room usage map</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="54" y="64" width="44" height="40" rx="4" fill="#fde9d7"/>
  <rect x="102" y="64" width="44" height="40" rx="4" fill="#faa14e"/>
  <rect x="150" y="64" width="44" height="40" rx="4" fill="#b75a04"/>
  <rect x="198" y="64" width="44" height="40" rx="4" fill="#fcc592"/>
  <rect x="54" y="108" width="44" height="40" rx="4" fill="#f87c0a"/>
  <rect x="102" y="108" width="44" height="40" rx="4" fill="#fde9d7"/>
  <rect x="150" y="108" width="44" height="40" rx="4" fill="#faa14e"/>
  <rect x="198" y="108" width="44" height="40" rx="4" fill="#b75a04"/>
  <rect x="54" y="152" width="44" height="40" rx="4" fill="#fcc592"/>
  <rect x="102" y="152" width="44" height="40" rx="4" fill="#f87c0a"/>
  <rect x="150" y="152" width="44" height="40" rx="4" fill="#fde9d7"/>
  <rect x="198" y="152" width="44" height="40" rx="4" fill="#faa14e"/>
  <rect x="54" y="210" width="30" height="12" fill="#fde9d7"/>
  <rect x="92" y="210" width="30" height="12" fill="#fcc592"/>
  <rect x="130" y="210" width="30" height="12" fill="#faa14e"/>
  <rect x="168" y="210" width="30" height="12" fill="#f87c0a"/>
  <rect x="206" y="210" width="30" height="12" fill="#b75a04"/>
  <text x="54" y="240" font-size="9" fill="#8e8e93">Low</text>
  <text x="246" y="240" font-size="9" text-anchor="end" fill="#8e8e93">High</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="314" y="64" width="44" height="40" rx="4" fill="#fde9d7"/>
  <rect x="362" y="64" width="44" height="40" rx="4" fill="#f98d29"/>
  <rect x="410" y="64" width="44" height="40" rx="4" fill="#fccfa5"/>
  <rect x="458" y="64" width="44" height="40" rx="4" fill="#e97305"/>
  <rect x="314" y="108" width="44" height="40" rx="4" fill="#fbb473"/>
  <rect x="362" y="108" width="44" height="40" rx="4" fill="#b75a04"/>
  <rect x="410" y="108" width="44" height="40" rx="4" fill="#fa9a42"/>
  <rect x="458" y="108" width="44" height="40" rx="4" fill="#fddcbe"/>
  <rect x="314" y="152" width="44" height="40" rx="4" fill="#f87f10"/>
  <rect x="362" y="152" width="44" height="40" rx="4" fill="#fcc28c"/>
  <rect x="410" y="152" width="44" height="40" rx="4" fill="#d06705"/>
  <rect x="458" y="152" width="44" height="40" rx="4" fill="#faa75a"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: five shades with a legend</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: twelve oranges, no legend</text>
</svg>

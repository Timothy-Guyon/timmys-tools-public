<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Undo before friction: A photo app&#x27;s Delete button</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A photo app&#x27;s Delete button</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="70" y="70" width="160" height="100" rx="4" fill="#3a5a40"/>
  <rect x="48" y="200" width="204" height="34" rx="8" fill="#1c1c1e"/>
  <text x="58" y="222" font-size="12" fill="#ffffff">In Recently Deleted</text>
  <text x="242" y="222" font-size="12" text-anchor="end" font-weight="600" fill="#64d2ff">Undo Delete</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="330" y="70" width="160" height="100" rx="4" fill="#3a5a40"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="rgb(0 0 0 / 0.25)"/>
  <rect x="325" y="106" width="170" height="100" rx="12" fill="#f2f2f7"/>
  <text x="410" y="130" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">Are you sure?</text>
  <text x="410" y="150" font-size="11" text-anchor="middle" fill="#1c1c1e">This cannot be undone.</text>
  <line x1="325" y1="172" x2="495" y2="172" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="367.5" y="194" font-size="13" text-anchor="middle" fill="#007aff">Cancel</text>
  <text x="452.5" y="194" font-size="13" text-anchor="middle" font-weight="600" fill="#ff3b30">Delete</text>
  <line x1="410" y1="172" x2="410" y2="206" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: kept 30 days, with Undo</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: erased for good after Are you sure?</text>
</svg>

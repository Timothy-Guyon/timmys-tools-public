<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Use before an account: A recipe app, first opened</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A recipe app, first opened</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Recipes</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Lemon pasta</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="146" font-size="14" fill="#1c1c1e">Tomato soup</text>
  <text x="246" y="146" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="180" font-size="14" fill="#1c1c1e">Banana bread</text>
  <text x="246" y="180" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="192" x2="260" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="220" font-size="11" text-anchor="middle" fill="#8e8e93">Save asks for an account</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="120" font-size="16" text-anchor="middle" font-weight="600" fill="#1c1c1e">Create an account</text>
  <text x="314" y="140" font-size="11" fill="#8e8e93">Email</text>
  <rect x="314" y="145" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="314" y="196" width="192" height="32" rx="10" fill="#007aff"/>
  <text x="410" y="216.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Continue</text>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: recipes open, account only at Save</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: Create an account before any recipe</text>
</svg>

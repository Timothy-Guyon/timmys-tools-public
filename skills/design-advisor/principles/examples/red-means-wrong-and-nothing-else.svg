<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Red means wrong and nothing else: A utility bill app&#x27;s account page</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A utility bill app&#x27;s account page</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <circle cx="62" cy="68" r="8" fill="#007aff"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Account</text>
  <text x="54" y="118" font-size="14" fill="#1c1c1e">November bill</text>
  <text x="246" y="118" font-size="13" text-anchor="end" fill="#8e8e93">£62.10</text>
  <line x1="40" y1="130" x2="260" y2="130" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="54" y="142" width="80" height="22" rx="11" fill="#ff3b30"/>
  <text x="94" y="156.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Overdue</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#ff3b30"/>
  <circle cx="322" cy="68" r="8" fill="#fff"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">Account</text>
  <text x="314" y="118" font-size="14" fill="#1c1c1e">November bill</text>
  <text x="506" y="118" font-size="13" text-anchor="end" fill="#8e8e93">£62.10</text>
  <line x1="300" y1="130" x2="520" y2="130" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="314" y="142" width="80" height="22" rx="11" fill="#ff3b30"/>
  <text x="354" y="156.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Overdue</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: red only on Overdue</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: red logo and bar too</text>
</svg>

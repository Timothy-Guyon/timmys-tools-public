<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What the app pushes in can wait: A share trading app&#x27;s order form, with headlines</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A share trading app&#x27;s order form, with headlines</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Buy shares</text>
  <text x="54" y="98" font-size="11" fill="#8e8e93">Company</text>
  <rect x="54" y="103" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="123" font-size="13" fill="#1c1c1e">Acme plc</text>
  <text x="54" y="148" font-size="11" fill="#8e8e93">Quantity</text>
  <rect x="54" y="153" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="173" font-size="13" fill="#1c1c1e">100</text>
  <text x="54" y="220" font-size="12" fill="#1c1c1e">Hold headlines</text>
  <rect x="206" y="204" width="40" height="24" rx="12" fill="#34c759"/>
  <circle cx="234" cy="216" r="10" fill="#ffffff"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Buy shares</text>
  <text x="314" y="98" font-size="11" fill="#8e8e93">Company</text>
  <rect x="314" y="103" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="123" font-size="13" fill="#1c1c1e">Acme plc</text>
  <text x="314" y="148" font-size="11" fill="#8e8e93">Quantity</text>
  <rect x="314" y="153" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="173" font-size="13" fill="#1c1c1e">100</text>
  <rect x="308" y="90" width="204" height="44" rx="10" fill="rgb(255 255 255 / 0.96)" stroke="#c7c7cc" stroke-width="1"/>
  <text x="318" y="108" font-size="9" fill="#8e8e93">MARKETS</text>
  <text x="318" y="125" font-size="12" font-weight="600" fill="#1c1c1e">Oil jumps 4% on supply fears</text>
  <rect x="314" y="204" width="192" height="30" rx="10" fill="#007aff"/>
  <text x="410" y="223.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Place order</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: Hold headlines while ordering</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: banners slide over the order form</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Small and far is mis-tapped: A cinema basket, thumb on the way to Buy tickets</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A cinema basket, thumb on the way to Buy tickets</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Basket</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">2 seats · Row F</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£24</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="54" y="144" width="192" height="30" rx="10" fill="#f2f2f7"/>
  <text x="150" y="163.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ff3b30">Remove all seats</text>
  <rect x="54" y="200" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="150" y="221.68" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Buy tickets</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Basket</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">2 seats · Row F</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£24</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="314" y="200" width="170" height="34" rx="10" fill="#007aff"/>
  <text x="399" y="221.68" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Buy tickets</text>
  <circle cx="496" cy="217" r="10" fill="#f2f2f7" stroke="#ff3b30" stroke-width="1"/>
  <text x="496" y="221" font-size="10" text-anchor="middle" fill="#ff3b30">✕</text>
  <rect x="480" y="200" width="32" height="34" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: Remove all a full button, 24 pt away</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: tiny Remove icon touching Buy</text>
</svg>

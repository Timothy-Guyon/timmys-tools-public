<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Nothing plays without a way to stop it: A news feed with videos</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A news feed with videos</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Feed</text>
  <rect x="54" y="96" width="192" height="108" rx="8" fill="#3a3a3c"/>
  <circle cx="74" cy="186" r="11" fill="rgb(0 0 0 / 0.5)"/>
  <text x="74" y="190" font-size="9" text-anchor="middle" fill="#fff">❚❚</text>
  <circle cx="226" cy="186" r="11" fill="rgb(0 0 0 / 0.5)"/>
  <text x="226" y="190" font-size="9" text-anchor="middle" fill="#fff">M̶</text>
  <text x="150" y="226" font-size="11" text-anchor="middle" fill="#8e8e93">Playing, muted</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Feed</text>
  <rect x="314" y="96" width="192" height="108" rx="8" fill="#3a3a3c"/>
  <text x="410" y="226" font-size="11" text-anchor="middle" fill="#d70015">Playing with sound</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: muted, pause and unmute in sight</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: plays with sound, no controls</text>
</svg>

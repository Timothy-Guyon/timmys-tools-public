  <rect x="360" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="410" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="460" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="310" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="360" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="410" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>

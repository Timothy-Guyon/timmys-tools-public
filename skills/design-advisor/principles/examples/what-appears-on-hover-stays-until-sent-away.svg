  <text x="464" y="118" font-size="10" text-anchor="middle" fill="#d70015">gone</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: stays while pointer moves on, Esc closes</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: vanishes on the way to it</text>

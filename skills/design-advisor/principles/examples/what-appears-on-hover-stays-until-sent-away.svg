  <rect x="50" y="118" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="100" y="118" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="150" y="118" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="200" y="118" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="50" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="100" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="150" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="200" y="142" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="50" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="100" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="150" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="200" y="166" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="100" y="94" width="50" height="24" fill="#fff" stroke="#007aff" stroke-width="2"/>
  <rect x="156" y="90" width="96" height="48" rx="4" fill="#fff8e1" stroke="#e0c060" stroke-width="1"/>
  <text x="162" y="108" font-size="10" fill="#1c1c1e">Check with Jo</text>
  <text x="162" y="124" font-size="10" fill="#1c1c1e">before Friday</text>
  <path transform="translate(40 50)" d="M118 66 l0 10 l3 -3 l3 5 l2 -1 l-3 -5 l4 0 z" fill="#1c1c1e" stroke="#1c1c1e" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>

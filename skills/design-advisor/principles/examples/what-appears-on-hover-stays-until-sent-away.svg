  <rect x="310" y="70" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="360" y="70" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>

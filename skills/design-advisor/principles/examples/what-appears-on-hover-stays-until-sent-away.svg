<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What appears on hover stays until sent away: A spreadsheet cell comment, pointer moving onto it</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A spreadsheet cell comment, pointer moving onto it</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="70" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>
  <rect x="100" y="70" width="50" height="24" fill="#fff" stroke="#e5e5ea" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Controls stand out at 3 to 1: A to-do list&#x27;s checkboxes</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A to-do list&#x27;s checkboxes</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <rect x="56" y="97" width="18" height="18" rx="4" fill="#fff" stroke="#8a8a8e" stroke-width="1.5"/>
  <text x="84" y="111" font-size="13" fill="#1c1c1e">Call bank</text>
  <rect x="56" y="131" width="18" height="18" rx="4" fill="#0a3d91"/>
  <path transform="translate(40 50)" d="M20 90 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="145" font-size="13" fill="#1c1c1e">Buy stamps</text>
  <rect x="56" y="165" width="18" height="18" rx="4" fill="#fff" stroke="#8a8a8e" stroke-width="1.5"/>
  <text x="84" y="179" font-size="13" fill="#1c1c1e">Book dentist</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <rect x="316" y="97" width="18" height="18" rx="4" fill="#fff" stroke="#e3e3e6" stroke-width="1.5"/>
  <text x="344" y="111" font-size="13" fill="#1c1c1e">Call bank</text>
  <rect x="316" y="131" width="18" height="18" rx="4" fill="#fff" stroke="#e3e3e6" stroke-width="1.5"/>
  <text x="344" y="145" font-size="13" fill="#1c1c1e">Buy stamps</text>
  <rect x="316" y="165" width="18" height="18" rx="4" fill="#fff" stroke="#e3e3e6" stroke-width="1.5"/>
  <text x="344" y="179" font-size="13" fill="#1c1c1e">Book dentist</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: outline 3.5:1, done box filled</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: pale outline at 1.5:1</text>
</svg>

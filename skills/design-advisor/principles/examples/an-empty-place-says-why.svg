<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An empty place says why: A library app&#x27;s Holds tab, no holds</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A library app&#x27;s Holds tab, no holds</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Holds</text>
  <text x="150" y="150" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">No holds yet.</text>
  <text x="150" y="172" font-size="11" text-anchor="middle" fill="#8e8e93">Search for a book to place one.</text>
  <rect x="40" y="210" width="220" height="36" fill="#f9f9f9"/>
  <line x1="40" y1="210" x2="260" y2="210" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="77" y="233" font-size="11" text-anchor="middle" fill="#8e8e93">Search</text>
  <text x="150" y="233" font-size="11" text-anchor="middle" fill="#8e8e93">Loans</text>
  <text x="223" y="233" font-size="11" text-anchor="middle" fill="#007aff">Holds</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Loans</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">The Hobbit</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">Due 3 Dec</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="146" font-size="14" fill="#1c1c1e">Dune</text>
  <text x="506" y="146" font-size="13" text-anchor="end" fill="#8e8e93">Due 9 Dec</text>
  <line x1="300" y1="158" x2="520" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="300" y="210" width="220" height="36" fill="#f9f9f9"/>
  <line x1="300" y1="210" x2="520" y2="210" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="337" y="233" font-size="11" text-anchor="middle" fill="#8e8e93">Search</text>
  <text x="410" y="233" font-size="11" text-anchor="middle" fill="#007aff">Loans</text>
  <text x="483" y="233" font-size="11" text-anchor="middle" fill="#d1d1d6">Holds</text>
  <rect x="460" y="216" width="56" height="26" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: says why it&#x27;s empty and what to do</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: tab greyed out, can&#x27;t be tapped</text>
</svg>

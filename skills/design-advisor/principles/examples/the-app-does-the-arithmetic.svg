<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The app does the arithmetic: A payments app splitting a £94 bill four ways</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A payments app splitting a £94 bill four ways</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Split bill</text>
  <text x="54" y="112" font-size="13" font-weight="600" fill="#1c1c1e">Total £94.00</text>
  <text x="54" y="142" font-size="12" fill="#1c1c1e">Ana</text>
  <text x="246" y="142" font-size="12" text-anchor="end" fill="#1c1c1e">£23.50</text>
  <text x="54" y="170" font-size="12" fill="#1c1c1e">Ben</text>
  <text x="246" y="170" font-size="12" text-anchor="end" fill="#1c1c1e">£23.50</text>
  <text x="54" y="198" font-size="12" fill="#1c1c1e">Cal</text>
  <text x="246" y="198" font-size="12" text-anchor="end" fill="#1c1c1e">£23.50</text>
  <text x="54" y="226" font-size="12" fill="#1c1c1e">Dee</text>
  <text x="246" y="226" font-size="12" text-anchor="end" fill="#1c1c1e">£23.50</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Split bill</text>
  <text x="314" y="112" font-size="13" font-weight="600" fill="#1c1c1e">Total £94.00</text>
  <text x="314" y="142" font-size="12" fill="#1c1c1e">Ana</text>
  <rect x="430" y="126" width="76" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="170" font-size="12" fill="#1c1c1e">Ben</text>
  <rect x="430" y="154" width="76" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="198" font-size="12" fill="#1c1c1e">Cal</text>
  <rect x="430" y="182" width="76" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="226" font-size="12" fill="#1c1c1e">Dee</text>
  <rect x="430" y="210" width="76" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: each owes £23.50</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: total only, each types their own share</text>
</svg>

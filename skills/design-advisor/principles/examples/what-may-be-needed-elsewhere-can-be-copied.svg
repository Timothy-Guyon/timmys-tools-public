<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What may be needed elsewhere can be copied: A bank app&#x27;s account details</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A bank app&#x27;s account details</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Account details</text>
  <text x="54" y="114" font-size="11" fill="#8e8e93">Account number</text>
  <text x="54" y="136" font-size="16" font-weight="600" fill="#1c1c1e">41 22 90 17</text>
  <text x="246" y="136" font-size="12" text-anchor="end" fill="#007aff">Copy</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Account details</text>
  <text x="314" y="114" font-size="11" fill="#8e8e93">Account number</text>
  <rect x="314" y="120" width="192" height="28" rx="6" fill="#f2f2f7"/>
  <text x="322" y="139" font-size="14" fill="#c7c7cc">41 22 90 17</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: full number with Copy</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: greyed field, can&#x27;t be selected</text>
</svg>

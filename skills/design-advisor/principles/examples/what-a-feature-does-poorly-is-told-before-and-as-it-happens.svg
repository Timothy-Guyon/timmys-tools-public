<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What a feature does poorly is told before and as it happens: A scanner app in a dim room</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A scanner app in a dim room</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="70" y="70" width="160" height="96" fill="#2c2c2e" stroke="#636366" stroke-width="1"/>
  <rect x="50" y="174" width="200" height="40" rx="8" fill="rgb(0 0 0 / 0.7)"/>
  <text x="58" y="190" font-size="11" font-weight="600" fill="#fff">Too dark to read the text.</text>
  <text x="58" y="206" font-size="10" fill="#d1d1d6">Turn on the light or move.</text>
  <rect x="190" y="220" width="60" height="22" rx="11" fill="#ffd60a"/>
  <text x="220" y="234.96" font-size="11" text-anchor="middle" font-weight="600" fill="#1c1c1e">Flash</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="314" y="64" width="192" height="168" rx="6" fill="#ffffff"/>
  <text x="324" y="94" font-size="12" fill="#1c1c1e">Ťh3 qu!ck br0wn</text>
  <text x="324" y="116" font-size="12" fill="#1c1c1e">f0x jumq5 ov3r</text>
  <text x="324" y="138" font-size="12" fill="#1c1c1e">tl1e l@zy d0g</text>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: says too dark, offers Flash</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: garbled text, no word why</text>
</svg>

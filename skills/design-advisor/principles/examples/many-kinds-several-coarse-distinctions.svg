<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Many kinds, several coarse distinctions: A metro map of twelve lines</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A metro map of twelve lines</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="70" y1="86" x2="240" y2="86" stroke="#e63946" stroke-width="6"/>
  <circle cx="62" cy="86" r="9" fill="#e63946"/>
  <text x="62" y="90" font-size="10" text-anchor="middle" font-weight="600" fill="#fff">A</text>
  <line x1="70" y1="122" x2="240" y2="122" stroke="#2a9d8f" stroke-width="6" stroke-dasharray="10 6"/>
  <circle cx="62" cy="122" r="9" fill="#2a9d8f"/>
  <text x="62" y="126" font-size="10" text-anchor="middle" font-weight="600" fill="#fff">B</text>
  <line x1="70" y1="158" x2="240" y2="158" stroke="#f4a261" stroke-width="6"/>
  <circle cx="62" cy="158" r="9" fill="#f4a261"/>
  <text x="62" y="162" font-size="10" text-anchor="middle" font-weight="600" fill="#fff">C</text>
  <line x1="70" y1="194" x2="240" y2="194" stroke="#6a4c93" stroke-width="6" stroke-dasharray="10 6"/>
  <circle cx="62" cy="194" r="9" fill="#6a4c93"/>
  <text x="62" y="198" font-size="10" text-anchor="middle" font-weight="600" fill="#fff">D</text>
  <text x="150" y="236" font-size="10" text-anchor="middle" fill="#8e8e93">… and 8 more lines</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="330" y1="86" x2="500" y2="86" stroke="#1d4e89" stroke-width="6"/>
  <line x1="330" y1="122" x2="500" y2="122" stroke="#2366a8" stroke-width="6"/>
  <line x1="330" y1="158" x2="500" y2="158" stroke="#2a74c0" stroke-width="6"/>
  <line x1="330" y1="194" x2="500" y2="194" stroke="#3584d1" stroke-width="6"/>
  <text x="410" y="236" font-size="10" text-anchor="middle" fill="#8e8e93">… and 8 more lines</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: colour, letter and dash</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: twelve shades of blue</text>
</svg>

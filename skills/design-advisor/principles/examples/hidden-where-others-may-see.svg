<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Hidden where others may see: A banking app&#x27;s card details</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A banking app&#x27;s card details</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Card</text>
  <rect x="60" y="98" width="180" height="104" rx="12" fill="#1d3557"/>
  <text x="76" y="158" font-size="14" fill="#fff">•••• •••• •••• 4821</text>
  <text x="76" y="186" font-size="11" fill="#cfd8e3">CVC •••</text>
  <text x="150" y="230" font-size="13" text-anchor="middle" fill="#007aff">Show</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Card</text>
  <rect x="320" y="98" width="180" height="104" rx="12" fill="#1d3557"/>
  <text x="336" y="158" font-size="14" fill="#fff">4929 1234 5678 4821</text>
  <text x="336" y="186" font-size="11" font-weight="600" fill="#ffffff">CVC 382</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: •••• 4821 with Show</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: full number and code on opening</text>
</svg>

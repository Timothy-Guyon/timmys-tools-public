<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Free while waiting: A podcast app downloading an episode</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A podcast app downloading an episode</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Library</text>
  <text x="54" y="113" font-size="14" fill="#1c1c1e">Ep 12 · Downloading</text>
  <text x="246" y="113" font-size="13" text-anchor="end" fill="#8e8e93">42%</text>
  <line x1="40" y1="126" x2="260" y2="126" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="149" font-size="14" fill="#1c1c1e">Ep 11</text>
  <text x="246" y="149" font-size="13" text-anchor="end" fill="#007aff">▶</text>
  <line x1="40" y1="162" x2="260" y2="162" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="185" font-size="14" fill="#1c1c1e">Ep 10</text>
  <text x="246" y="185" font-size="13" text-anchor="end" fill="#007aff">▶</text>
  <line x1="40" y1="198" x2="260" y2="198" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Library</text>
  <text x="314" y="113" font-size="14" fill="#1c1c1e">Ep 12 · Downloading</text>
  <text x="506" y="113" font-size="13" text-anchor="end" fill="#8e8e93">42%</text>
  <line x1="300" y1="126" x2="520" y2="126" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="149" font-size="14" fill="#1c1c1e">Ep 11</text>
  <text x="506" y="149" font-size="13" text-anchor="end" fill="#007aff">▶</text>
  <line x1="300" y1="162" x2="520" y2="162" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="185" font-size="14" fill="#1c1c1e">Ep 10</text>
  <text x="506" y="185" font-size="13" text-anchor="end" fill="#007aff">▶</text>
  <line x1="300" y1="198" x2="520" y2="198" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="rgb(255 255 255 / 0.85)"/>
  <circle cx="410" cy="148" r="16" fill="none" stroke="#8e8e93" stroke-width="3" stroke-dasharray="20 8"/>
  <text x="410" y="188" font-size="12" text-anchor="middle" fill="#8e8e93">Downloading…</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: browse and play meanwhile</text>
  <text x="410" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#d70015">Fail: a spinner covers everything</text>
</svg>

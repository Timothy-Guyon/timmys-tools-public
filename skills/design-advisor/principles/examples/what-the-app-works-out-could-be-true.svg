<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What the app works out could be true: A budget app when bills take all the income</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A budget app when bills take all the income</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Food budget</text>
  <text x="54" y="120" font-size="12" fill="#1c1c1e">Your bills take all of this</text>
  <text x="54" y="138" font-size="12" fill="#1c1c1e">month&#x27;s income, so there is</text>
  <text x="54" y="156" font-size="12" fill="#1c1c1e">no food budget to suggest.</text>
  <rect x="54" y="180" width="192" height="30" rx="10" fill="#007aff"/>
  <text x="150" y="199.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Review bills</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Food budget</text>
  <text x="314" y="120" font-size="12" fill="#8e8e93">Suggested food budget</text>
  <text x="314" y="154" font-size="22" font-weight="600" fill="#1c1c1e">−£120 a month</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: says there&#x27;s no food budget to suggest</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: Suggested food budget: −£120</text>
</svg>

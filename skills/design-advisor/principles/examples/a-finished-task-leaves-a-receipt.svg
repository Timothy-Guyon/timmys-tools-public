<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A finished task leaves a receipt: A concert ticket purchase, finished</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A concert ticket purchase, finished</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Order 48213</text>
  <text x="150" y="120" font-size="13" text-anchor="middle" fill="#1c1c1e">2 tickets · 14 Mar</text>
  <rect x="80" y="140" width="140" height="32" rx="10" fill="#1c1c1e"/>
  <text x="150" y="160.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Add to Wallet</text>
  <text x="150" y="200" font-size="11" text-anchor="middle" fill="#248a3d">Saved in Orders</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="150" font-size="20" text-anchor="middle" font-weight="600" fill="#1c1c1e">Thank you!</text>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: order number, Wallet, kept in Orders</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: a Thank you! that can&#x27;t be found again</text>
</svg>

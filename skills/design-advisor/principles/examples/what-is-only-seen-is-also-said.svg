<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What is only seen is also said: A furniture assembly video</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A furniture assembly video</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="200" height="120" rx="6" fill="#2c2c2e"/>
  <rect x="100" y="120" width="100" height="12" fill="#a2845e"/>
  <circle cx="110" cy="110" r="10" fill="#f0c9a8"/>
  <circle cx="190" cy="110" r="10" fill="#f0c9a8"/>
  <text x="150" y="210" font-size="11" text-anchor="middle" font-style="italic" fill="#1c1c1e">“Slide the two short rails into</text>
  <text x="150" y="226" font-size="11" text-anchor="middle" font-style="italic" fill="#1c1c1e">the top panel”</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="64" width="200" height="120" rx="6" fill="#2c2c2e"/>
  <rect x="360" y="120" width="100" height="12" fill="#a2845e"/>
  <circle cx="370" cy="110" r="10" fill="#f0c9a8"/>
  <circle cx="450" cy="110" r="10" fill="#f0c9a8"/>
  <text x="410" y="210" font-size="11" text-anchor="middle" font-style="italic" fill="#d70015">♪ music only ♪</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: a voice says each step</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: hands at work over music</text>
</svg>

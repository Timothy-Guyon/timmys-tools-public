<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A long list in an order people can predict: A car hire app&#x27;s country picker</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A car hire app&#x27;s country picker</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Country</text>
  <text x="54" y="110" font-size="14" fill="#1c1c1e">Netherlands</text>
  <line x1="40" y1="120" x2="260" y2="120" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="140" font-size="14" fill="#1c1c1e">New Zealand</text>
  <line x1="40" y1="150" x2="260" y2="150" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="170" font-size="14" fill="#1c1c1e">Norway</text>
  <line x1="40" y1="180" x2="260" y2="180" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="200" font-size="14" fill="#1c1c1e">Oman</text>
  <line x1="40" y1="210" x2="260" y2="210" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="230" font-size="14" fill="#1c1c1e">Peru</text>
  <line x1="40" y1="240" x2="260" y2="240" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Country</text>
  <text x="314" y="110" font-size="14" fill="#1c1c1e">Spain</text>
  <line x1="300" y1="120" x2="520" y2="120" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="140" font-size="14" fill="#1c1c1e">France</text>
  <line x1="300" y1="150" x2="520" y2="150" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="170" font-size="14" fill="#1c1c1e">Italy</text>
  <line x1="300" y1="180" x2="520" y2="180" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="200" font-size="14" fill="#1c1c1e">Greece</text>
  <line x1="300" y1="210" x2="520" y2="210" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="230" font-size="14" fill="#1c1c1e">Portugal</text>
  <line x1="300" y1="240" x2="520" y2="240" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: alphabetical</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: by bookings, Norway could be anywhere</text>
</svg>

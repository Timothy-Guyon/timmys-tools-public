<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Only what is needed is asked: A pizza delivery checkout</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A pizza delivery checkout</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Checkout</text>
  <text x="54" y="108" font-size="12" fill="#1c1c1e">Address</text>
  <line x1="40" y1="116" x2="260" y2="116" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="138" font-size="12" fill="#1c1c1e">Phone for the driver</text>
  <line x1="40" y1="146" x2="260" y2="146" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Checkout</text>
  <text x="314" y="108" font-size="12" fill="#1c1c1e">Title</text>
  <line x1="300" y1="116" x2="520" y2="116" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="138" font-size="12" fill="#1c1c1e">Date of birth</text>
  <line x1="300" y1="146" x2="520" y2="146" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="168" font-size="12" fill="#1c1c1e">Address</text>
  <line x1="300" y1="176" x2="520" y2="176" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="198" font-size="12" fill="#1c1c1e">Phone for the driver</text>
  <line x1="300" y1="206" x2="520" y2="206" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="306" y="94" width="208" height="52" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: address and a phone number</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: also date of birth and title</text>
</svg>

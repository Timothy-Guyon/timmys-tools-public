<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>As it was left: A recipe app: Edit, and the reopened ingredients sheet</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A recipe app: Edit, and the reopened ingredients sheet</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Edit recipe</text>
  <text x="54" y="100" font-size="11" fill="#8e8e93">Servings</text>
  <rect x="54" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="125" font-size="13" fill="#1c1c1e">4</text>
  <text x="54" y="162" font-size="12" fill="#8e8e93">Ingredients</text>
  <circle cx="64" cy="180" r="9" fill="#007aff"/>
  <path transform="translate(40 50)" d="M20 130 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="185" font-size="13" fill="#1c1c1e">Flour</text>
  <circle cx="64" cy="202" r="9" fill="#007aff"/>
  <path transform="translate(40 50)" d="M20 152 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="207" font-size="13" fill="#1c1c1e">Eggs</text>
  <circle cx="64" cy="224" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="80" y="229" font-size="13" fill="#1c1c1e">Milk</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Edit recipe</text>
  <text x="314" y="100" font-size="11" fill="#8e8e93">Servings</text>
  <rect x="314" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="125" font-size="13" fill="#1c1c1e">1</text>
  <text x="314" y="162" font-size="12" fill="#8e8e93">Ingredients</text>
  <circle cx="324" cy="180" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="340" y="185" font-size="13" fill="#1c1c1e">Flour</text>
  <circle cx="324" cy="202" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="340" y="207" font-size="13" fill="#1c1c1e">Eggs</text>
  <circle cx="324" cy="224" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="340" y="229" font-size="13" fill="#1c1c1e">Milk</text>
  <rect x="310" y="102" width="200" height="38" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: fields as saved, ticks kept</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: servings reset, ticks cleared</text>
</svg>

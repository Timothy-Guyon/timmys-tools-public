<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An entry is taken without a verdict: A budgeting app after a £40 takeaway is entered</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A budgeting app after a £40 takeaway is entered</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Eating out</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Takeaway</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£40</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="48" y="160" width="204" height="34" rx="8" fill="#1c1c1e"/>
  <text x="58" y="182" font-size="12" fill="#ffffff">Added. £60 left this month</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Eating out</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">Takeaway</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£40</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="310" y="146" width="200" height="50" rx="8" fill="#fff1f0"/>
  <text x="318" y="166" font-size="12" font-weight="600" fill="#d70015">Another takeaway?</text>
  <text x="318" y="184" font-size="12" fill="#d70015">Try cooking at home.</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: added, £60 left this month</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: Another takeaway? Try cooking</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An exception is never learned: A messaging app&#x27;s long-press on a voice note</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A messaging app&#x27;s long-press on a voice note</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="130" height="30" rx="14" fill="#f2f2f7"/>
  <text x="60" y="84" font-size="12" fill="#1c1c1e">See you soon</text>
  <rect x="50" y="104" width="150" height="30" rx="14" fill="#f2f2f7"/>
  <text x="60" y="124" font-size="12" fill="#1c1c1e">▶ ▂▅▃▆▂▅ 0:12</text>
  <rect x="100" y="142" width="130" height="90" rx="10" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="114" y="164" font-size="12" fill="#1c1c1e">Reply</text>
  <text x="114" y="192" font-size="12" fill="#1c1c1e">Copy</text>
  <text x="114" y="220" font-size="12" fill="#ff3b30">Delete</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="64" width="130" height="30" rx="14" fill="#f2f2f7"/>
  <text x="320" y="84" font-size="12" fill="#1c1c1e">See you soon</text>
  <rect x="310" y="104" width="150" height="30" rx="14" fill="#f2f2f7"/>
  <text x="320" y="124" font-size="12" fill="#1c1c1e">▶ ▂▅▃▆▂▅ 0:12</text>
  <circle cx="410" cy="190" r="26" fill="#ff3b30"/>
  <text x="410" y="195" font-size="12" text-anchor="middle" font-weight="600" fill="#fff">Rec</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: same menu as texts and photos</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: starts recording instead</text>
</svg>

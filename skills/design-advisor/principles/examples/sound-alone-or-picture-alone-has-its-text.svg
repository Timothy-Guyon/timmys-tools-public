<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Sound alone or picture alone has its text: A podcast app&#x27;s episode page</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A podcast app&#x27;s episode page</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Episode 12</text>
  <rect x="50" y="94" width="200" height="26" rx="8" fill="#f2f2f7"/>
  <rect x="52" y="96" width="98" height="22" rx="7" fill="#fff"/>
  <text x="101" y="111" font-size="11" text-anchor="middle" fill="#1c1c1e">Transcript</text>
  <text x="199" y="111" font-size="11" text-anchor="middle" fill="#1c1c1e">Notes</text>
  <line x1="54" y1="136" x2="240" y2="136" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="152" x2="210" y2="152" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="168" x2="240" y2="168" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="184" x2="210" y2="184" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="200" x2="240" y2="200" stroke="#d1d1d6" stroke-width="6"/>
  <rect x="120" y="216" width="60" height="24" rx="12" fill="#007aff"/>
  <text x="150" y="232.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">▶</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Episode 12</text>
  <rect x="310" y="94" width="200" height="26" rx="8" fill="#f2f2f7"/>
  <text x="410" y="111" font-size="11" text-anchor="middle" fill="#1c1c1e">Notes</text>
  <line x1="314" y1="136" x2="500" y2="136" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="152" x2="470" y2="152" stroke="#d1d1d6" stroke-width="6"/>
  <rect x="380" y="216" width="60" height="24" rx="12" fill="#007aff"/>
  <text x="410" y="232.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">▶</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: a Transcript tab with every word</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: only audio and a two-line summary</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A one-key shortcut can be turned off: an email website where D deletes</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">An email website where D deletes</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="70" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="150" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">mail.example</text>
  <text x="54" y="100" font-size="13" font-weight="600" fill="#1c1c1e">Settings</text>
  <text x="54" y="132" font-size="12" fill="#1c1c1e">Keyboard shortcuts</text>
  <rect x="206" y="116" width="40" height="24" rx="12" fill="#e5e5ea"/>
  <circle cx="218" cy="128" r="10" fill="#ffffff"/>
  <text x="54" y="160" font-size="11" fill="#8e8e93">Off: D does nothing</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="330" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="410" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">mail.example</text>
  <text x="314" y="100" font-size="13" font-weight="600" fill="#1c1c1e">Lunch?</text>
  <rect x="380" y="140" width="60" height="40" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="166" font-size="16" text-anchor="middle" font-weight="600" fill="#1c1c1e">D</text>
  <text x="410" y="206" font-size="11" text-anchor="middle" fill="#d70015">stray key: message deleted</text>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: Keyboard shortcuts: Off in Settings</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: D always deletes, no off</text>
</svg>

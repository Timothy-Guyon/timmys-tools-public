<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A second alone: A parcel app&#x27;s Driver arriving notice, animated</title>
  <desc>Animated, 4-second loop. Left: Driver arriving appears and stays. Right: it is replaced by a Rate your driver card half a second after it appears.</desc>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A parcel app&#x27;s Driver arriving notice, animated</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your parcel</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite"/><rect x="50" y="110" width="200" height="44" rx="8" fill="#e8f8ec" stroke="#c7c7cc"/><text x="60" y="137" font-size="13" font-weight="600" fill="#1c1c1e">Driver arriving</text></g>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your parcel</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.125;0.13;1" dur="4s" repeatCount="indefinite"/><rect x="310" y="110" width="200" height="44" rx="8" fill="#e8f8ec" stroke="#c7c7cc"/><text x="320" y="137" font-size="13" font-weight="600" fill="#1c1c1e">Driver arriving</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.125;0.13;0.95;1" dur="4s" repeatCount="indefinite"/><rect x="310" y="110" width="200" height="44" rx="8" fill="#ffffff" stroke="#c7c7cc"/><text x="320" y="137" font-size="13" font-weight="600" fill="#1c1c1e">Rate your driver ★★★★★</text></g>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#248a3d">Pass: stays still for several seconds</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: replaced by Rate your driver in 0.5 s</text>
</svg>

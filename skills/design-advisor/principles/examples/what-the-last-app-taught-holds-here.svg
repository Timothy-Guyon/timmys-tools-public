<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What the last app taught holds here: A new camera app: a volume button pressed</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A new camera app: a volume button pressed</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="60" y="66" width="180" height="130" fill="#4a6fa5"/>
  <rect x="254" y="90" width="6" height="30" rx="2" fill="#8e8e93"/>
  <rect x="60" y="66" width="180" height="130" fill="#ffffff" opacity="0.5"/>
  <text x="150" y="226" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Photo taken</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="320" y="66" width="180" height="130" fill="#4a6fa5"/>
  <rect x="514" y="90" width="6" height="30" rx="2" fill="#8e8e93"/>
  <text x="410" y="226" font-size="13" text-anchor="middle" font-weight="600" fill="#ffd60a">Zoom 2×</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: takes the photo, as before</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: zooms instead</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Sections labelled, in rank: A hotel app&#x27;s room page</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A hotel app&#x27;s room page</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="76" font-size="15" font-weight="600" fill="#1c1c1e">Room</text>
  <line x1="54" y1="86" x2="220" y2="86" stroke="#d1d1d6" stroke-width="6"/>
  <text x="54" y="116" font-size="15" font-weight="600" fill="#1c1c1e">Price</text>
  <line x1="54" y1="126" x2="190" y2="126" stroke="#d1d1d6" stroke-width="6"/>
  <text x="64" y="148" font-size="12" font-weight="600" fill="#1c1c1e">Breakfast</text>
  <line x1="64" y1="158" x2="180" y2="158" stroke="#d1d1d6" stroke-width="6"/>
  <text x="54" y="188" font-size="15" font-weight="600" fill="#1c1c1e">Cancellation</text>
  <line x1="54" y1="198" x2="210" y2="198" stroke="#d1d1d6" stroke-width="6"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="314" y1="80" x2="480" y2="80" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="300" y1="98" x2="520" y2="98" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <line x1="314" y1="122" x2="450" y2="122" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="300" y1="140" x2="520" y2="140" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <line x1="314" y1="164" x2="480" y2="164" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="300" y1="182" x2="520" y2="182" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <line x1="314" y1="206" x2="450" y2="206" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="300" y1="224" x2="520" y2="224" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: bold headings, a smaller one beneath</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: one size, no headings, only lines</text>
</svg>

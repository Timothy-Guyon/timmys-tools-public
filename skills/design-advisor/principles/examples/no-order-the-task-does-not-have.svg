<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>No order the task does not have: A hotel booking&#x27;s guest form</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A hotel booking&#x27;s guest form</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="66" font-size="11" fill="#8e8e93">Name</text>
  <rect x="54" y="71" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="91" font-size="13" fill="#1c1c1e">Ana Ruiz</text>
  <text x="54" y="116" font-size="11" fill="#8e8e93">Arrival time</text>
  <rect x="54" y="121" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="166" font-size="11" fill="#8e8e93">Requests</text>
  <rect x="54" y="171" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="191" font-size="13" fill="#1c1c1e">Quiet room</text>
  <text x="150" y="230" font-size="11" text-anchor="middle" fill="#8e8e93">Arrival can wait</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="80" font-size="11" fill="#8e8e93">Question 2 of 3</text>
  <text x="314" y="100" font-size="11" fill="#8e8e93">Arrival time</text>
  <rect x="314" y="105" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="314" y="190" width="192" height="34" rx="10" fill="#a7c8f2"/>
  <text x="410" y="212.04" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Next</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: fill in any order, leave arrival for later</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: one field at a time, must guess</text>
</svg>

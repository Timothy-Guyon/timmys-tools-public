<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Whether it is for them, before the work: A mortgage app that can&#x27;t lend on holiday homes</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A mortgage app that can&#x27;t lend on holiday homes</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Step 1 of 3</text>
  <text x="54" y="110" font-size="13" font-weight="600" fill="#1c1c1e">What is the home for?</text>
  <text x="54" y="138" font-size="14" fill="#1c1c1e">Live in it</text>
  <line x1="40" y1="148" x2="260" y2="148" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="168" font-size="14" fill="#1c1c1e">Let it out</text>
  <line x1="40" y1="178" x2="260" y2="178" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="198" font-size="14" fill="#1c1c1e">Holiday home</text>
  <line x1="40" y1="208" x2="260" y2="208" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="236" cy="193" r="9" fill="#007aff"/>
  <path transform="translate(40 50)" d="M192 143 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="208" width="200" height="32" rx="6" fill="#fff8e1"/>
  <text x="58" y="228" font-size="11" fill="#1c1c1e">We can&#x27;t lend on holiday homes</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Step 9 of 9</text>
  <text x="314" y="108" font-size="12" fill="#8e8e93">✓ Payslips uploaded</text>
  <text x="314" y="128" font-size="12" fill="#8e8e93">✓ Bank statements uploaded</text>
  <text x="314" y="148" font-size="12" fill="#8e8e93">✓ ID checked</text>
  <rect x="310" y="164" width="200" height="56" rx="8" fill="#fff1f0" stroke="#ffb3ad" stroke-width="1"/>
  <text x="318" y="186" font-size="12" font-weight="600" fill="#d70015">Application declined:</text>
  <text x="318" y="206" font-size="11" fill="#d70015">we don&#x27;t lend on holiday homes</text>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: says so up front, before documents</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: turned down after all the paperwork</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A sound says its source: driving directions: a turn and a speed camera</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">Driving directions: a turn and a speed camera</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Directions</text>
  <text x="54" y="112" font-size="12" font-weight="600" fill="#1c1c1e">Turn</text>
  <text x="54" y="130" font-size="11" fill="#8e8e93">♪ ding-dong · tap tap</text>
  <text x="54" y="154" font-size="12" font-weight="600" fill="#1c1c1e">Speed camera</text>
  <text x="54" y="172" font-size="11" fill="#8e8e93">♪ triple chime · long buzz</text>
  <text x="54" y="196" font-size="12" font-weight="600" fill="#1c1c1e">Signal lost</text>
  <text x="54" y="214" font-size="11" fill="#8e8e93">♪ low tone · tap</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Directions</text>
  <text x="314" y="112" font-size="12" font-weight="600" fill="#1c1c1e">Turn</text>
  <text x="314" y="130" font-size="11" fill="#d70015">♪ beep · tap</text>
  <text x="314" y="154" font-size="12" font-weight="600" fill="#1c1c1e">Speed camera</text>
  <text x="314" y="172" font-size="11" fill="#d70015">♪ beep · tap</text>
  <text x="314" y="196" font-size="12" font-weight="600" fill="#1c1c1e">Signal lost</text>
  <text x="314" y="214" font-size="11" fill="#d70015">♪ beep · tap</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: each has its own chime and tap</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: one beep for everything</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A status is heard without moving the person: A shop&#x27;s Add to basket with a screen reader</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A shop&#x27;s Add to basket with a screen reader</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Shoes</text>
  <text x="250" y="73" font-size="13" text-anchor="end" fill="#007aff">Basket</text>
  <circle cx="252" cy="58" r="7" fill="#ff3b30"/>
  <text x="252" y="62" font-size="9" text-anchor="middle" font-weight="600" fill="#fff">3</text>
  <rect x="54" y="190" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="150" y="211.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Add to basket</text>
  <rect x="50" y="186" width="200" height="42" rx="12" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="150" y="150" font-size="12" text-anchor="middle" font-style="italic" fill="#248a3d">“Added, 3 items in basket”</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Shoes</text>
  <text x="510" y="73" font-size="13" text-anchor="end" fill="#007aff">Basket</text>
  <circle cx="512" cy="58" r="7" fill="#ff3b30"/>
  <text x="512" y="62" font-size="9" text-anchor="middle" font-weight="600" fill="#fff">3</text>
  <rect x="314" y="190" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="410" y="211.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Add to basket</text>
  <rect x="310" y="186" width="200" height="42" rx="12" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="410" y="150" font-size="12" text-anchor="middle" font-style="italic" fill="#d70015">(silence)</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: says Added, 3 items, stays on the button</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: badge changes in silence</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A way out in sight: A news app&#x27;s full-screen video, nothing to lose</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A news app&#x27;s full-screen video, nothing to lose</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#000000"/>
  <rect x="40" y="110" width="220" height="80" fill="#3a3a3c"/>
  <text x="150" y="156" font-size="22" text-anchor="middle" fill="#ffffff">▶</text>
  <circle cx="236" cy="72" r="12" fill="rgb(255 255 255 / 0.25)"/>
  <text x="236" y="77" font-size="13" text-anchor="middle" fill="#fff">✕</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#000000"/>
  <rect x="300" y="110" width="220" height="80" fill="#3a3a3c"/>
  <text x="410" y="156" font-size="22" text-anchor="middle" fill="#ffffff">▶</text>
  <text x="410" y="226" font-size="11" text-anchor="middle" fill="#8e8e93">swipe down to close</text>
  <text x="506" y="74" font-size="12" text-anchor="end" fill="#fff">Cancel</text>
  <rect x="460" y="58" width="56" height="24" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: an X to close, in sight</text>
  <text x="410" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d70015">Fail: swipe only, or a Cancel button</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An entry far from the usual is queried: A taxi app&#x27;s tip screen, 200% entered</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A taxi app&#x27;s tip screen, 200% entered</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Add a tip</text>
  <text x="54" y="106" font-size="12" fill="#8e8e93">Fare £30</text>
  <text x="54" y="122" font-size="11" fill="#8e8e93">Tip</text>
  <rect x="54" y="127" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="147" font-size="13" fill="#1c1c1e">200%</text>
  <rect x="50" y="168" width="200" height="64" rx="8" fill="#fff8e1"/>
  <text x="58" y="188" font-size="12" font-weight="600" fill="#1c1c1e">Tip £60 on a £30 fare?</text>
  <text x="58" y="206" font-size="11" fill="#8e8e93">Usual: 15% (£4.50)</text>
  <text x="58" y="224" font-size="11" fill="#007aff">Change</text>
  <text x="240" y="224" font-size="11" text-anchor="end" fill="#007aff">Yes, tip £60</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Add a tip</text>
  <text x="314" y="106" font-size="12" fill="#8e8e93">Fare £30</text>
  <text x="314" y="122" font-size="11" fill="#8e8e93">Tip</text>
  <rect x="314" y="127" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="147" font-size="13" fill="#1c1c1e">200%</text>
  <rect x="314" y="190" width="192" height="34" rx="10" fill="#34c759"/>
  <text x="410" y="212.04" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Pay £90</text>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: asks Tip £60 on a £30 fare?</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: takes it without a word</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Type and contrast are the person&#x27;s: A weather forecast list with Larger Text on</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A weather forecast list with Larger Text on</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="90" font-size="20" fill="#3a3a3c">Mon</text>
  <text x="246" y="90" font-size="20" text-anchor="end" fill="#3a3a3c">12°</text>
  <text x="54" y="134" font-size="20" fill="#3a3a3c">Tue</text>
  <text x="246" y="134" font-size="20" text-anchor="end" fill="#3a3a3c">9°</text>
  <text x="54" y="178" font-size="20" fill="#3a3a3c">Wed</text>
  <text x="246" y="178" font-size="20" text-anchor="end" fill="#3a3a3c">11°</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#dbe9f6"/>
  <text x="314" y="80" font-size="10" fill="#b0bec5">Mon</text>
  <text x="506" y="80" font-size="10" text-anchor="end" fill="#b0bec5">12°</text>
  <text x="314" y="102" font-size="10" fill="#b0bec5">Tue</text>
  <text x="506" y="102" font-size="10" text-anchor="end" fill="#b0bec5">9°</text>
  <text x="314" y="124" font-size="10" fill="#b0bec5">Wed</text>
  <text x="506" y="124" font-size="10" text-anchor="end" fill="#b0bec5">11°</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: system sizes grow, dark on white</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: fixed 10 pt light grey on pale blue</text>
</svg>

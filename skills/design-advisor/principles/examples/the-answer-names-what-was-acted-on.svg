<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The answer names what was acted on: a cloud drive's answer to Delete</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A cloud drive, just after Delete</text>
  <g font-size="14" fill="#1c1c1e">
    <!-- Pass -->
    <rect x="40" y="50" width="220" height="196" fill="#ffffff" stroke="#c7c7cc"/>
    <text x="56" y="80">Notes.docx</text><line x1="40" x2="260" y1="96" y2="96" stroke="rgb(0 0 0 / 0.12)"/>
    <text x="56" y="120">Photos</text><line x1="40" x2="260" y1="136" y2="136" stroke="rgb(0 0 0 / 0.12)"/>
    <rect x="48" y="196" width="204" height="38" rx="8" fill="#1c1c1e"/>
    <text x="58" y="220" font-size="12" fill="#ffffff">Budget.xlsx moved to Bin</text>
    <text x="242" y="220" font-size="12" font-weight="600" fill="#64d2ff" text-anchor="end">Undo</text>
    <!-- Fail -->
    <rect x="300" y="50" width="220" height="196" fill="#ffffff" stroke="#c7c7cc"/>
    <text x="316" y="80">Notes.docx</text><line x1="300" x2="520" y1="96" y2="96" stroke="rgb(0 0 0 / 0.12)"/>
    <text x="316" y="120">Photos</text><line x1="300" x2="520" y1="136" y2="136" stroke="rgb(0 0 0 / 0.12)"/>
    <rect x="370" y="196" width="80" height="38" rx="8" fill="#1c1c1e"/>
    <text x="410" y="220" font-size="13" fill="#ffffff" text-anchor="middle">Done</text>
  </g>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: names the file and where it went</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: Done, but which file?</text>
</svg>

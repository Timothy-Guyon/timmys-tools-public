<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The menu can be skipped in one step: A news article page, first Tab</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A news article page, first Tab</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="70" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="150" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">news.example</text>
  <text x="50" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="85" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="120" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="155" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="190" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="225" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="50" y="110" font-size="10" fill="#8e8e93">… 24 more links</text>
  <line x1="54" y1="140" x2="230" y2="140" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="158" x2="210" y2="158" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="176" x2="190" y2="176" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="194" x2="170" y2="194" stroke="#d1d1d6" stroke-width="6"/>
  <rect x="50" y="80" width="110" height="22" rx="4" fill="#1c1c1e"/>
  <text x="105" y="94.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Skip to article</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="330" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="410" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">news.example</text>
  <text x="310" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="345" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="380" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="415" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="450" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="485" y="94" font-size="10" fill="#007aff">Link</text>
  <text x="310" y="110" font-size="10" fill="#8e8e93">… 24 more links</text>
  <line x1="314" y1="140" x2="490" y2="140" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="158" x2="470" y2="158" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="176" x2="450" y2="176" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="194" x2="430" y2="194" stroke="#d1d1d6" stroke-width="6"/>
  <rect x="306" y="82" width="30" height="16" rx="3" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="410" y="230" font-size="10" text-anchor="middle" fill="#d70015">Tab 1 of 30…</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Skip to article appears</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: tab through 30 menu links each time</text>
</svg>

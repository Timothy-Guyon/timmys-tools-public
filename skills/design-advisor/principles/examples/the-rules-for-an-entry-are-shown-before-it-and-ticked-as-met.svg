<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The rules for an entry are shown before it and ticked as met: A username field: 3 to 16 characters, letters and numbers</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A username field: 3 to 16 characters, letters and numbers</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Choose a username</text>
  <text x="54" y="98" font-size="11" fill="#8e8e93">Username</text>
  <rect x="54" y="103" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="123" font-size="13" fill="#1c1c1e">sam99</text>
  <circle cx="64" cy="162" r="9" fill="#34c759"/>
  <path transform="translate(40 50)" d="M20 112 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="166" font-size="12" fill="#1c1c1e">3 to 16 characters</text>
  <circle cx="64" cy="186" r="9" fill="#34c759"/>
  <path transform="translate(40 50)" d="M20 136 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="190" font-size="12" fill="#1c1c1e">Letters and numbers only</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Choose a username</text>
  <text x="314" y="98" font-size="11" fill="#8e8e93">Username</text>
  <rect x="314" y="103" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="322" y="123" font-size="13" fill="#1c1c1e">sam_99</text>
  <text x="314" y="147" font-size="11" fill="#d70015">Letters and numbers only</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: both rules shown, each ticks</text>
  <text x="410" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#d70015">Fail: told one at a time, after refusals</text>
</svg>

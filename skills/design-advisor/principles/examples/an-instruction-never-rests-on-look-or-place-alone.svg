<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>An instruction never rests on look or place alone: A photo printing app&#x27;s order screen hint</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A photo printing app&#x27;s order screen hint</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your prints</text>
  <rect x="54" y="96" width="80" height="60" rx="4" fill="#e5e5ea"/>
  <text x="54" y="180" font-size="11" fill="#8e8e93">Tap Add to basket to continue.</text>
  <rect x="150" y="200" width="96" height="30" rx="10" fill="#34c759"/>
  <text x="198" y="218.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Add to basket</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Your prints</text>
  <rect x="314" y="96" width="80" height="60" rx="4" fill="#e5e5ea"/>
  <text x="314" y="180" font-size="11" fill="#8e8e93">Tap the green button on the right.</text>
  <rect x="410" y="200" width="96" height="30" rx="10" fill="#34c759"/>
  <text x="458" y="218.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Add to basket</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: Tap Add to basket to continue</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: Tap the green button on the right</text>
</svg>

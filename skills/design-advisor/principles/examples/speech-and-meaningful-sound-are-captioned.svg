<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Speech and meaningful sound are captioned: A cooking video&#x27;s captions</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A cooking video&#x27;s captions</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="200" height="80" rx="6" fill="#2c2c2e"/>
  <rect x="60" y="114" width="180" height="22" rx="3" fill="rgb(0 0 0 / 0.75)"/>
  <text x="150" y="129" font-size="10" text-anchor="middle" fill="#fff">[Chef] Now fold in the flour</text>
  <rect x="50" y="154" width="200" height="80" rx="6" fill="#2c2c2e"/>
  <rect x="60" y="204" width="180" height="22" rx="3" fill="rgb(0 0 0 / 0.75)"/>
  <text x="150" y="219" font-size="10" text-anchor="middle" fill="#fff">[oven timer beeps]</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="64" width="200" height="80" rx="6" fill="#2c2c2e"/>
  <rect x="320" y="114" width="180" height="22" rx="3" fill="rgb(0 0 0 / 0.75)"/>
  <text x="410" y="129" font-size="10" text-anchor="middle" fill="#fff">[Chef] Now fold in the flour</text>
  <rect x="310" y="154" width="200" height="80" rx="6" fill="#2c2c2e"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: speaker and the oven beep captioned</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: words only, the beep goes unseen</text>
</svg>

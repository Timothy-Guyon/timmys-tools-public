<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A skipped step stays open: A tax filing app&#x27;s checklist, Bank interest skipped</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A tax filing app&#x27;s checklist, Bank interest skipped</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="64" cy="106" r="9" fill="#34c759"/>
  <path transform="translate(40 50)" d="M20 56 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="111" font-size="13" fill="#1c1c1e">Income</text>
  <circle cx="64" cy="136" r="9" fill="#34c759"/>
  <path transform="translate(40 50)" d="M20 86 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="141" font-size="13" fill="#1c1c1e">Pensions</text>
  <circle cx="64" cy="166" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="82" y="171" font-size="13" fill="#1c1c1e">Bank interest</text>
  <text x="246" y="171" font-size="11" text-anchor="end" fill="#d70015">Not started</text>
  <rect x="54" y="200" width="192" height="34" rx="10" fill="#d1d1d6"/>
  <text x="150" y="222.04" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Submit</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="58" width="200" height="26" rx="6" fill="#34c759"/>
  <text x="410" y="75" font-size="12" text-anchor="middle" font-weight="600" fill="#fff">All done!</text>
  <circle cx="324" cy="106" r="9" fill="#34c759"/>
  <path transform="translate(300 50)" d="M20 56 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="111" font-size="13" fill="#1c1c1e">Income</text>
  <circle cx="324" cy="136" r="9" fill="#34c759"/>
  <path transform="translate(300 50)" d="M20 86 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="141" font-size="13" fill="#1c1c1e">Pensions</text>
  <circle cx="324" cy="166" r="9" fill="#34c759"/>
  <path transform="translate(300 50)" d="M20 116 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="171" font-size="13" fill="#1c1c1e">Bank interest</text>
  <rect x="314" y="200" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="410" y="222.04" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">Submit</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Not started, Submit off</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: All done while it&#x27;s empty</text>
</svg>

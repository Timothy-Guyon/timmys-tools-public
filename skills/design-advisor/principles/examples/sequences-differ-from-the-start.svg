<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Sequences differ from the start: A messaging app&#x27;s compose bar</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A messaging app&#x27;s compose bar</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="110" font-size="12" text-anchor="middle" fill="#8e8e93">Message to Sam</text>
  <rect x="50" y="200" width="140" height="32" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="221" font-size="12" fill="#1c1c1e">See you at 6</text>
  <circle cx="210" cy="216" r="15" fill="#f2f2f7"/>
  <circle cx="210" cy="216" r="7" fill="none" stroke="#1c1c1e" stroke-width="1.5"/>
  <line x1="210" y1="216" x2="210" y2="212" stroke="#1c1c1e" stroke-width="1.5"/>
  <line x1="210" y1="216" x2="213" y2="216" stroke="#1c1c1e" stroke-width="1.5"/>
  <circle cx="242" cy="216" r="15" fill="#007aff"/>
  <text x="242" y="221" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">↑</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="110" font-size="12" text-anchor="middle" fill="#8e8e93">Message to Sam</text>
  <rect x="310" y="200" width="170" height="32" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="221" font-size="12" fill="#1c1c1e">See you at 6</text>
  <circle cx="500" cy="216" r="15" fill="#007aff"/>
  <text x="500" y="221" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">↑</text>
  <rect x="446" y="160" width="70" height="32" rx="8" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="481" y="181" font-size="11" text-anchor="middle" fill="#007aff">Later</text>
  <rect x="440" y="156" width="82" height="82" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: Schedule has its own button</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: Schedule hides behind Send</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>A row that scrolls sideways fades at its edges: a shop's row of product cards</title>
<defs><clipPath id="c1"><rect x="40" y="70" width="220" height="130"/></clipPath><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.15" stop-color="#fff"/><stop offset="0.85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m1"><rect x="40" y="70" width="220" height="130" fill="url(#g1)"/></mask><clipPath id="c2"><rect x="300" y="70" width="220" height="130"/></clipPath></defs>
<rect width="560" height="300" fill="#ffffff"/>
<text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A shop's row of product cards that scrolls sideways</text>
<text x="40" y="60" font-size="13" fill="#3a3a3c">New arrivals</text><text x="300" y="60" font-size="13" fill="#3a3a3c">New arrivals</text>
<g clip-path="url(#c1)" mask="url(#m1)"><rect x="0" y="78" width="84" height="114" rx="12" fill="#e8a87c"/><rect x="96" y="78" width="84" height="114" rx="12" fill="#85c1c8"/><rect x="192" y="78" width="84" height="114" rx="12" fill="#c3a6d8"/><rect x="288" y="78" width="84" height="114" rx="12" fill="#9fcf8f"/><rect x="384" y="78" width="84" height="114" rx="12" fill="#f2c94c"/></g><g clip-path="url(#c2)"><rect x="260" y="78" width="84" height="114" rx="12" fill="#e8a87c"/><rect x="356" y="78" width="84" height="114" rx="12" fill="#85c1c8"/><rect x="452" y="78" width="84" height="114" rx="12" fill="#c3a6d8"/><rect x="548" y="78" width="84" height="114" rx="12" fill="#9fcf8f"/><rect x="644" y="78" width="84" height="114" rx="12" fill="#f2c94c"/></g>
<text x="150" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: cards fade out at each edge,</text>
<text x="150" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">the next one still peeking</text>
<text x="410" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: cards sliced off</text>
<text x="410" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">by a hard edge</text>
</svg>
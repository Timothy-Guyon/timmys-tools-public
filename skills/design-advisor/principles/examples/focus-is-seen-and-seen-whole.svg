<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Focus is seen, and seen whole: A bank website&#x27;s payment form, Tab on Pay</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A bank website&#x27;s payment form, Tab on Pay</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="70" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="150" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">bank.example</text>
  <text x="54" y="86" font-size="11" fill="#8e8e93">Amount</text>
  <rect x="54" y="91" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="111" font-size="13" fill="#1c1c1e">£40</text>
  <rect x="54" y="140" width="192" height="30" rx="10" fill="#007aff"/>
  <text x="150" y="159.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Pay</text>
  <rect x="50" y="136" width="200" height="38" rx="12" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="40" y="200" width="220" height="46" fill="#3a3a3c"/>
  <text x="54" y="226" font-size="11" fill="#fff">We use cookies.  Accept</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="330" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="410" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">bank.example</text>
  <text x="314" y="86" font-size="11" fill="#8e8e93">Amount</text>
  <rect x="314" y="91" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="111" font-size="13" fill="#1c1c1e">£40</text>
  <rect x="314" y="206" width="192" height="30" rx="10" fill="#007aff"/>
  <text x="410" y="225.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Pay</text>
  <rect x="310" y="202" width="200" height="38" rx="12" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="300" y="190" width="220" height="56" fill="#3a3a3c"/>
  <text x="314" y="220" font-size="11" fill="#fff">We use cookies.  Accept</text>
  <text x="410" y="180" font-size="10" text-anchor="middle" fill="#d70015">focus is under here ↓</text>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#248a3d">Pass: Pay ringed, clear of the banner</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: ringed Pay hidden under the cookie banner</text>
</svg>

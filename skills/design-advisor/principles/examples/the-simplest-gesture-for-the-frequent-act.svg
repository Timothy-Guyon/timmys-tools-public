<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The simplest gesture for the frequent act: A reading app&#x27;s page turn</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A reading app&#x27;s page turn</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="54" y1="74" x2="230" y2="74" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="92" x2="210" y2="92" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="110" x2="190" y2="110" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="128" x2="230" y2="128" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="146" x2="210" y2="146" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="164" x2="190" y2="164" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="54" y1="182" x2="230" y2="182" stroke="#d1d1d6" stroke-width="6"/>
  <circle cx="236" cy="150" r="12" fill="rgb(0 122 255 / 0.25)" stroke="#007aff" stroke-width="1"/>
  <text x="236" y="190" font-size="11" text-anchor="middle" fill="#007aff">tap</text>
  <text x="150" y="230" font-size="10" text-anchor="middle" fill="#8e8e93">Page 12</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="314" y1="74" x2="490" y2="74" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="92" x2="470" y2="92" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="110" x2="450" y2="110" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="128" x2="490" y2="128" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="146" x2="470" y2="146" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="164" x2="450" y2="164" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="182" x2="490" y2="182" stroke="#d1d1d6" stroke-width="6"/>
  <circle cx="440" cy="150" r="9" fill="rgb(255 59 48 / 0.25)" stroke="#ff3b30" stroke-width="1"/>
  <circle cx="460" cy="150" r="9" fill="rgb(255 59 48 / 0.25)" stroke="#ff3b30" stroke-width="1"/>
  <circle cx="480" cy="150" r="9" fill="rgb(255 59 48 / 0.25)" stroke="#ff3b30" stroke-width="1"/>
  <text x="450" y="190" font-size="11" text-anchor="middle" fill="#d70015">← swipe with 3</text>
  <text x="410" y="230" font-size="10" text-anchor="middle" fill="#8e8e93">Page 12</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: a one-finger tap near the edge</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: a three-finger swipe</text>
</svg>

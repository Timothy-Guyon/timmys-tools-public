<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Nobody gets stuck moving item by item: A listings website&#x27;s map, moved through with Tab</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A listings website&#x27;s map, moved through with Tab</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="70" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="150" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">homes.example</text>
  <rect x="50" y="82" width="200" height="100" rx="6" fill="#e8eef2"/>
  <rect x="216" y="90" width="26" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="229" y="106.04" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">+</text>
  <rect x="216" y="116" width="26" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="229" y="132.04" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">−</text>
  <rect x="50" y="192" width="200" height="40" rx="6" fill="#f2f2f7"/>
  <text x="60" y="216" font-size="11" fill="#1c1c1e">2-bed flat, £1,200 pcm</text>
  <rect x="48" y="190" width="204" height="44" rx="8" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <path transform="translate(40 50)" d="M188 92 C 190 120, 150 130, 120 138" fill="none" stroke="#007aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="24" fill="#e5e5ea"/>
  <rect x="330" y="55" width="160" height="14" rx="7" fill="#fff"/>
  <text x="410" y="66" font-size="9" text-anchor="middle" fill="#8e8e93">homes.example</text>
  <rect x="310" y="82" width="200" height="100" rx="6" fill="#e8eef2"/>
  <rect x="476" y="90" width="26" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="489" y="106.04" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">+</text>
  <rect x="476" y="116" width="26" height="22" rx="4" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="489" y="132.04" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">−</text>
  <rect x="310" y="192" width="200" height="40" rx="6" fill="#f2f2f7"/>
  <text x="320" y="216" font-size="11" fill="#1c1c1e">2-bed flat, £1,200 pcm</text>
  <path transform="translate(300 50)" d="M204 55 C 216 62, 216 72, 204 78 M172 78 C 162 70, 162 60, 172 52" fill="none" stroke="#ff3b30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: Tab goes on to the first listing</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: Tab circles the zoom buttons</text>
</svg>

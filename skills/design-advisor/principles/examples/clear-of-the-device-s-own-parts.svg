<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Clear of the device&#x27;s own parts: A music app&#x27;s mini player at the foot</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A music app&#x27;s mini player at the foot</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="190" width="220" height="56" fill="#2c2c2e"/>
  <rect x="54" y="198" width="26" height="26" rx="4" fill="#5e5ce6"/>
  <text x="88" y="216" font-size="12" fill="#fff">Night Drive</text>
  <circle cx="230" cy="210" r="11" fill="#fff"/>
  <text x="230" y="214" font-size="10" text-anchor="middle" fill="#1c1c1e">▶</text>
  <rect x="110" y="236" width="80" height="5" rx="2.5" fill="#fff"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="190" width="220" height="56" fill="#2c2c2e"/>
  <rect x="314" y="198" width="26" height="26" rx="4" fill="#5e5ce6"/>
  <text x="348" y="216" font-size="12" fill="#fff">Night Drive</text>
  <circle cx="490" cy="230" r="11" fill="#fff"/>
  <text x="490" y="234" font-size="10" text-anchor="middle" fill="#1c1c1e">▶</text>
  <rect x="370" y="236" width="80" height="5" rx="2.5" fill="#fff"/>
  <rect x="470" y="216" width="40" height="30" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Play above the home bar</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: Play half under the home bar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A tap that leaves, downloads or needs a sign-in says so in its words: an energy app&#x27;s bill screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">An energy app&#x27;s bill screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Bills</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">November</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£84.20</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="160" font-size="12" fill="#007aff">Download your bill (PDF, 2 pages)</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Bills</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">November</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">£84.20</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="160" font-size="12" fill="#007aff">Your bill</text>
  <rect x="310" y="190" width="200" height="30" rx="6" fill="#f2f2f7"/>
  <text x="320" y="209" font-size="11" fill="#8e8e93">⬇ bill-2026-11.pdf downloading</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: Download your bill (PDF, 2 pages)</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: Your bill, downloads unannounced</text>
</svg>

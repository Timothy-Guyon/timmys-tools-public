<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Motion never makes a person wait: A place card rising, caught halfway by a finger, animated</title>
  <desc>Animated, 4-second loop. A finger touches the rising card halfway. Left: the card turns and follows the finger down. Right: the card keeps rising to the top and only then moves down.</desc>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A place card rising, caught halfway by a finger, animated</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cp223"><rect x="40" y="50" width="220" height="196" rx="14"/></clipPath>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <g clip-path="url(#cp223)"><g transform="translate(40 50)"><g><animateTransform attributeName="transform" type="translate" values="0 196;0 100;0 160;0 196;0 196" keyTimes="0;0.25;0.45;0.6;1" dur="4s" repeatCount="indefinite"/><rect x="0" y="0" width="220" height="200" rx="14" fill="#fff" stroke="#c7c7cc"/><rect x="95" y="6" width="30" height="4" rx="2" fill="#c7c7cc"/><text x="14" y="32" font-size="13" font-weight="600" fill="#1c1c1e">Corner Café</text></g></g></g>
  <circle cx="190" cy="154" r="12" fill="rgb(0 0 0 / 0.25)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.6;0.62;1" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="154;154;214;214" keyTimes="0;0.25;0.45;1" dur="4s" repeatCount="indefinite"/></circle>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cf223"><rect x="300" y="50" width="220" height="196" rx="14"/></clipPath>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <g clip-path="url(#cf223)"><g transform="translate(300 50)"><g><animateTransform attributeName="transform" type="translate" values="0 196;0 100;0 30;0 30;0 160;0 196;0 196" keyTimes="0;0.25;0.4;0.5;0.7;0.8;1" dur="4s" repeatCount="indefinite"/><rect x="0" y="0" width="220" height="200" rx="14" fill="#fff" stroke="#c7c7cc"/><rect x="95" y="6" width="30" height="4" rx="2" fill="#c7c7cc"/><text x="14" y="32" font-size="13" font-weight="600" fill="#1c1c1e">Corner Café</text></g></g></g>
  <circle cx="450" cy="154" r="12" fill="rgb(0 0 0 / 0.25)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.7;0.72;1" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="154;154;154;214" keyTimes="0;0.25;0.5;1" dur="4s" repeatCount="indefinite"/></circle>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: follows the finger back down at once</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: ignores touch until it has finished rising</text>
</svg>

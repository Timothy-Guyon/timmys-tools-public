<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A choice costs its uncertainty, not its count: A coffee app&#x27;s drinks list, known to regulars</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A coffee app&#x27;s drinks list, known to regulars</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="74" font-size="12" fill="#1c1c1e">Espresso</text>
  <text x="54" y="104" font-size="12" fill="#1c1c1e">Latte</text>
  <text x="54" y="134" font-size="12" fill="#1c1c1e">Flat white</text>
  <text x="54" y="164" font-size="12" fill="#1c1c1e">Mocha</text>
  <text x="54" y="194" font-size="12" fill="#1c1c1e">Tea</text>
  <text x="158" y="74" font-size="12" fill="#1c1c1e">Chai</text>
  <text x="158" y="104" font-size="12" fill="#1c1c1e">Americano</text>
  <text x="158" y="134" font-size="12" fill="#1c1c1e">Cortado</text>
  <text x="158" y="164" font-size="12" fill="#1c1c1e">Macchiato</text>
  <text x="158" y="194" font-size="12" fill="#1c1c1e">Oat latte</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="74" font-size="12" fill="#1c1c1e">Espresso</text>
  <text x="314" y="104" font-size="12" fill="#1c1c1e">Latte</text>
  <text x="314" y="134" font-size="12" fill="#1c1c1e">Flat white</text>
  <text x="314" y="164" font-size="12" fill="#1c1c1e">Mocha</text>
  <text x="314" y="194" font-size="12" fill="#1c1c1e">Tea</text>
  <text x="418" y="74" font-size="12" fill="#1c1c1e">Chai</text>
  <text x="418" y="104" font-size="12" fill="#1c1c1e">Americano</text>
  <text x="418" y="134" font-size="12" fill="#1c1c1e">Cortado</text>
  <text x="418" y="164" font-size="12" fill="#1c1c1e">Macchiato</text>
  <text x="418" y="224" font-size="11" fill="#d70015">Oat latte?</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: all ten drinks stay</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: cut to nine, a regular&#x27;s drink gone</text>
</svg>

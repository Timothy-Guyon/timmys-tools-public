<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Two quantities, two shapes: an oven app&#x27;s cook screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">An oven app&#x27;s cook screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Cook</text>
  <text x="54" y="116" font-size="11" fill="#8e8e93">Temperature</text>
  <text x="54" y="150" font-size="28" font-weight="600" fill="#1c1c1e">180 °C</text>
  <text x="54" y="180" font-size="11" fill="#8e8e93">Time</text>
  <text x="54" y="214" font-size="28" font-weight="600" fill="#bf5af2">0:45</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Cook</text>
  <rect x="314" y="110" width="92" height="60" rx="8" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
  <text x="360" y="150" font-size="26" text-anchor="middle" font-weight="600" fill="#1c1c1e">180</text>
  <rect x="414" y="110" width="92" height="60" rx="8" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
  <text x="460" y="150" font-size="26" text-anchor="middle" font-weight="600" fill="#1c1c1e">45</text>
  <text x="314" y="198" font-size="11" fill="#d70015">Is 45 a time or a temperature?</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: 180 °C and 0:45 look different</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: 180 and 45 in alike boxes</text>
</svg>

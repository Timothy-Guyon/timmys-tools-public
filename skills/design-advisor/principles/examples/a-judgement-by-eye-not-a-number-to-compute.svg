<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A judgement by eye, not a number to compute: A phone&#x27;s storage screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A phone&#x27;s storage screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Storage</text>
  <rect x="54" y="110" width="62" height="20" fill="#ff9f0a"/>
  <rect x="116" y="110" width="28" height="20" fill="#5e5ce6"/>
  <rect x="144" y="110" width="14" height="20" fill="#34c759"/>
  <rect x="158" y="110" width="88" height="20" fill="#e5e5ea"/>
  <rect x="54" y="146" width="10" height="10" rx="2" fill="#ff9f0a"/>
  <text x="68" y="155" font-size="10" fill="#1c1c1e">Photos</text>
  <rect x="120" y="146" width="10" height="10" rx="2" fill="#5e5ce6"/>
  <text x="134" y="155" font-size="10" fill="#1c1c1e">Apps</text>
  <rect x="186" y="146" width="10" height="10" rx="2" fill="#34c759"/>
  <text x="200" y="155" font-size="10" fill="#1c1c1e">Messages</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Storage</text>
  <text x="314" y="111" font-size="14" fill="#1c1c1e">Photos</text>
  <text x="506" y="111" font-size="13" text-anchor="end" fill="#8e8e93">41.2 GB</text>
  <line x1="300" y1="122" x2="520" y2="122" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="143" font-size="14" fill="#1c1c1e">Apps</text>
  <text x="506" y="143" font-size="13" text-anchor="end" fill="#8e8e93">18.7 GB</text>
  <line x1="300" y1="154" x2="520" y2="154" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="175" font-size="14" fill="#1c1c1e">Messages</text>
  <text x="506" y="175" font-size="13" text-anchor="end" fill="#8e8e93">9.3 GB</text>
  <line x1="300" y1="186" x2="520" y2="186" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="207" font-size="14" fill="#1c1c1e">Capacity</text>
  <text x="506" y="207" font-size="13" text-anchor="end" fill="#8e8e93">128 GB</text>
  <line x1="300" y1="218" x2="520" y2="218" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: one bar split into lengths</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: GB numbers to work out</text>
</svg>

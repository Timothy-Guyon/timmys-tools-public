<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The least text that gets most people to the goal: A library app&#x27;s loans page</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A library app&#x27;s loans page</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Loans</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Dune</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">Due 3 Dec</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="146" font-size="14" fill="#1c1c1e">The Hobbit</text>
  <text x="246" y="146" font-size="13" text-anchor="end" fill="#8e8e93">Due 9 Dec</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="54" y="170" width="192" height="32" rx="10" fill="#007aff"/>
  <text x="150" y="190.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Renew all</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Loans</text>
  <line x1="314" y1="102" x2="500" y2="102" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="116" x2="460" y2="116" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="130" x2="500" y2="130" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="144" x2="460" y2="144" stroke="#d1d1d6" stroke-width="6"/>
  <line x1="314" y1="158" x2="500" y2="158" stroke="#d1d1d6" stroke-width="6"/>
  <text x="314" y="192" font-size="14" fill="#1c1c1e">Dune</text>
  <text x="506" y="192" font-size="13" text-anchor="end" fill="#8e8e93">Due 3 Dec</text>
  <line x1="300" y1="204" x2="520" y2="204" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="314" y="212" width="192" height="26" rx="10" fill="#007aff"/>
  <text x="410" y="228.96" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">Renew all</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: one Renew all button by the dates</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: a paragraph of instructions first</text>
</svg>

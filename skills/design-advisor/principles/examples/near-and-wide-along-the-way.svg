<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Near and wide along the way: A podcast player: Play and Skip back</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A podcast player: Play and Skip back</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="90" y="60" width="120" height="90" rx="8" fill="#ff9f0a"/>
  <circle cx="120" cy="200" r="22" fill="#f2f2f7"/>
  <text x="120" y="205" font-size="11" text-anchor="middle" fill="#1c1c1e">↺15</text>
  <circle cx="180" cy="200" r="22" fill="#1c1c1e"/>
  <text x="180" y="206" font-size="16" text-anchor="middle" fill="#fff">▶</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="350" y="60" width="120" height="90" rx="8" fill="#ff9f0a"/>
  <circle cx="500" cy="66" r="10" fill="#f2f2f7"/>
  <text x="500" y="70" font-size="10" text-anchor="middle" fill="#1c1c1e">↺</text>
  <rect x="486" y="52" width="28" height="28" rx="14" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="410" cy="200" r="22" fill="#1c1c1e"/>
  <text x="410" y="206" font-size="16" text-anchor="middle" fill="#fff">▶</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: Skip back beside Play, both 44 pt</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: 20 pt Skip back far up top</text>
</svg>

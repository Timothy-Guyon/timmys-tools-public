<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Visible in proportion to who needs it: A calculator app&#x27;s keypad</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A calculator app&#x27;s keypad</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="56" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="76" y="87.4" font-size="15" text-anchor="middle" fill="#ffffff">7</text>
  <rect x="106" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="126" y="87.4" font-size="15" text-anchor="middle" fill="#ffffff">8</text>
  <rect x="156" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="176" y="87.4" font-size="15" text-anchor="middle" fill="#ffffff">9</text>
  <rect x="206" y="64" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="226" y="87.4" font-size="15" text-anchor="middle" fill="#ffffff">÷</text>
  <rect x="56" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="76" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="106" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="126" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="156" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="176" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">6</text>
  <rect x="206" y="108" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="226" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">×</text>
  <rect x="56" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="76" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="106" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="126" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="156" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="176" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="206" y="152" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="226" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">−</text>
  <rect x="56" y="196" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="76" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">0</text>
  <rect x="106" y="196" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="126" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">.</text>
  <rect x="156" y="196" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="176" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">=</text>
  <rect x="206" y="196" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="226" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">+</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1c1c1e"/>
  <rect x="316" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="336" y="86.32" font-size="12" text-anchor="middle" fill="#ffffff">sinh</text>
  <rect x="366" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="386" y="86.32" font-size="12" text-anchor="middle" fill="#ffffff">cosh</text>
  <rect x="416" y="64" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="436" y="86.32" font-size="12" text-anchor="middle" fill="#ffffff">More</text>
  <rect x="466" y="64" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="486" y="87.4" font-size="15" text-anchor="middle" fill="#ffffff">×</text>
  <rect x="316" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="336" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">7</text>
  <rect x="366" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="386" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">8</text>
  <rect x="416" y="108" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="436" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">9</text>
  <rect x="466" y="108" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="486" y="131.4" font-size="15" text-anchor="middle" fill="#ffffff">−</text>
  <rect x="316" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="336" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="366" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="386" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="416" y="152" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="436" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">6</text>
  <rect x="466" y="152" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="486" y="175.4" font-size="15" text-anchor="middle" fill="#ffffff">+</text>
  <rect x="316" y="196" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="336" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="366" y="196" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="386" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="416" y="196" width="40" height="36" rx="18" fill="#3a3a3c"/>
  <text x="436" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="466" y="196" width="40" height="36" rx="18" fill="#ff9f0a"/>
  <text x="486" y="219.4" font-size="15" text-anchor="middle" fill="#ffffff">=</text>
  <rect x="410" y="60" width="48" height="44" rx="20" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: ÷ in view, sinh and cosh behind a swipe</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: sinh and cosh shown, ÷ under More</text>
</svg>

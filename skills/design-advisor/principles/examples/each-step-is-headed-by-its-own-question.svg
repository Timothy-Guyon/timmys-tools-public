<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Each step is headed by its own question: A mortgage app&#x27;s About you steps</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A mortgage app&#x27;s About you steps</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="60" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="58" y="80" font-size="10" fill="#8e8e93">Step 1</text>
  <text x="58" y="100" font-size="13" font-weight="600" fill="#1c1c1e">What is your name?</text>
  <rect x="50" y="122" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="58" y="142" font-size="10" fill="#8e8e93">Step 2</text>
  <text x="58" y="162" font-size="13" font-weight="600" fill="#1c1c1e">Date of birth?</text>
  <rect x="50" y="184" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="58" y="204" font-size="10" fill="#8e8e93">Step 3</text>
  <text x="58" y="224" font-size="13" font-weight="600" fill="#1c1c1e">Where do you live?</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="60" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="318" y="80" font-size="10" fill="#8e8e93">Step 1</text>
  <text x="318" y="100" font-size="13" font-weight="600" fill="#1c1c1e">About you</text>
  <rect x="310" y="122" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="318" y="142" font-size="10" fill="#8e8e93">Step 2</text>
  <text x="318" y="162" font-size="13" font-weight="600" fill="#1c1c1e">About you</text>
  <rect x="310" y="184" width="200" height="54" rx="8" fill="#f2f2f7"/>
  <text x="318" y="204" font-size="10" fill="#8e8e93">Step 3</text>
  <text x="318" y="224" font-size="13" font-weight="600" fill="#1c1c1e">About you</text>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: each headed by its question</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: each headed About you</text>
</svg>

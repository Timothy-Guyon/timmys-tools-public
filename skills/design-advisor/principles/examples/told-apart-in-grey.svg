<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Told apart in grey: A parcel app&#x27;s status dots, seen in greyscale</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A parcel app&#x27;s status dots, seen in greyscale</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="80" font-size="11" fill="#8e8e93">Colour</text>
  <text x="160" y="80" font-size="11" fill="#8e8e93">Greyscale</text>
  <circle cx="64" cy="106" r="9" fill="#1e6b2e"/>
  <text x="78" y="111" font-size="12" fill="#1c1c1e">Delivered</text>
  <circle cx="170" cy="106" r="9" fill="#555"/>
  <text x="184" y="111" font-size="12" fill="#1c1c1e">Delivered</text>
  <circle cx="64" cy="146" r="9" fill="#ffe680"/>
  <text x="78" y="151" font-size="12" fill="#1c1c1e">Pending</text>
  <circle cx="170" cy="146" r="9" fill="#e0e0e0"/>
  <text x="184" y="151" font-size="12" fill="#1c1c1e">Pending</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="80" font-size="11" fill="#8e8e93">Colour</text>
  <text x="420" y="80" font-size="11" fill="#8e8e93">Greyscale</text>
  <circle cx="324" cy="106" r="9" fill="#d33"/>
  <text x="338" y="111" font-size="12" fill="#1c1c1e">Delivered</text>
  <circle cx="430" cy="106" r="9" fill="#7a7a7a"/>
  <text x="444" y="111" font-size="12" fill="#1c1c1e">Delivered</text>
  <circle cx="324" cy="146" r="9" fill="#2a9d2a"/>
  <text x="338" y="151" font-size="12" fill="#1c1c1e">Pending</text>
  <circle cx="430" cy="146" r="9" fill="#7c7c7c"/>
  <text x="444" y="151" font-size="12" fill="#1c1c1e">Pending</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: still two different greys</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: red and green turn the same grey</text>
</svg>

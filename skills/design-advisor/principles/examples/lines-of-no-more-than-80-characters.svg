<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Lines of no more than 80 characters: A news article on a tablet held sideways</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A news article on a tablet held sideways</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="90" y1="70" x2="210" y2="70" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="88" x2="204" y2="88" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="106" x2="198" y2="106" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="124" x2="210" y2="124" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="142" x2="204" y2="142" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="160" x2="198" y2="160" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="178" x2="210" y2="178" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="196" x2="204" y2="196" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="90" y1="214" x2="198" y2="214" stroke="#c7c7cc" stroke-width="5"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <line x1="308" y1="70" x2="512" y2="70" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="88" x2="506" y2="88" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="106" x2="500" y2="106" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="124" x2="512" y2="124" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="142" x2="506" y2="142" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="160" x2="500" y2="160" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="178" x2="512" y2="178" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="196" x2="506" y2="196" stroke="#c7c7cc" stroke-width="5"/>
  <line x1="308" y1="214" x2="500" y2="214" stroke="#c7c7cc" stroke-width="5"/>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: a 70-character column with margins</text>
  <text x="410" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#d70015">Fail: 140 characters edge to edge</text>
</svg>

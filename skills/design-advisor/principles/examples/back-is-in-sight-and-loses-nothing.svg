<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Back is in sight and loses nothing: A train booking&#x27;s three steps, going back to seats</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A train booking&#x27;s three steps, going back to seats</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Seats</text>
  <text x="50" y="73" font-size="13" fill="#007aff">‹ Back</text>
  <rect x="66" y="104" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="94" y="104" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="122" y="104" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="150" y="104" width="22" height="22" rx="4" fill="#e5e5ea"/>

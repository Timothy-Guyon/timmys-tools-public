  <rect x="206" y="104" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="66" y="134" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="94" y="134" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="122" y="134" width="22" height="22" rx="4" fill="#007aff"/>
  <rect x="150" y="134" width="22" height="22" rx="4" fill="#007aff"/>
  <rect x="178" y="134" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="206" y="134" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="66" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="94" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="122" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="150" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="178" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>
  <rect x="206" y="164" width="22" height="22" rx="4" fill="#e5e5ea"/>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Verbs act, nouns choose: A parcel tracking app&#x27;s delivery page</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A parcel tracking app&#x27;s delivery page</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="200" height="30" rx="8" fill="#f2f2f7"/>
  <rect x="52" y="66" width="98" height="26" rx="7" fill="#fff"/>
  <text x="101" y="84" font-size="12" text-anchor="middle" fill="#1c1c1e">Active</text>
  <text x="199" y="84" font-size="12" text-anchor="middle" fill="#1c1c1e">Delivered</text>
  <text x="54" y="130" font-size="13" font-weight="600" fill="#1c1c1e">Parcel from Shopco</text>
  <text x="54" y="150" font-size="12" fill="#8e8e93">Arrives Thursday</text>
  <rect x="54" y="190" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="150" y="211.68" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Reschedule delivery</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="64" width="200" height="30" rx="8" fill="#f2f2f7"/>
  <rect x="312" y="66" width="98" height="26" rx="7" fill="#fff"/>
  <text x="361" y="84" font-size="12" text-anchor="middle" fill="#1c1c1e">Active</text>
  <text x="459" y="84" font-size="12" text-anchor="middle" fill="#1c1c1e">Delivered</text>
  <text x="314" y="130" font-size="13" font-weight="600" fill="#1c1c1e">Parcel from Shopco</text>
  <text x="314" y="150" font-size="12" fill="#8e8e93">Arrives Thursday</text>
  <rect x="314" y="190" width="192" height="34" rx="10" fill="#007aff"/>
  <text x="410" y="211.68" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Delivery</text>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#248a3d">Pass: button says Reschedule delivery</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: button says Delivery</text>
</svg>

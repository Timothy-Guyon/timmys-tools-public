<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A correction holds: A photo app&#x27;s face labels, after renaming Tom to Sam and a new scan</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A photo app&#x27;s face labels, after renaming Tom to Sam and a new scan</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">People</text>
  <rect x="54" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="83" cy="120" r="12" fill="#c7a17a"/>
  <text x="83" y="172" font-size="12" text-anchor="middle" fill="#1c1c1e">Sam</text>
  <rect x="120" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="149" cy="120" r="12" fill="#c7a17a"/>
  <text x="149" y="172" font-size="12" text-anchor="middle" fill="#1c1c1e">Sam</text>
  <rect x="186" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="215" cy="120" r="12" fill="#c7a17a"/>
  <text x="215" y="172" font-size="12" text-anchor="middle" fill="#1c1c1e">Sam</text>
  <text x="150" y="214" font-size="11" text-anchor="middle" fill="#8e8e93">after next scan</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">People</text>
  <rect x="314" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="343" cy="120" r="12" fill="#c7a17a"/>
  <text x="343" y="172" font-size="12" text-anchor="middle" fill="#1c1c1e">Sam</text>
  <rect x="380" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="409" cy="120" r="12" fill="#c7a17a"/>
  <text x="409" y="172" font-size="12" text-anchor="middle" font-weight="600" fill="#d70015">Tom</text>
  <rect x="446" y="96" width="58" height="58" rx="6" fill="#e5e5ea"/>
  <circle cx="475" cy="120" r="12" fill="#c7a17a"/>
  <text x="475" y="172" font-size="12" text-anchor="middle" font-weight="600" fill="#d70015">Tom</text>
  <text x="410" y="214" font-size="11" text-anchor="middle" fill="#8e8e93">after next scan</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: every photo still says Sam</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: the scan puts Tom back</text>
</svg>

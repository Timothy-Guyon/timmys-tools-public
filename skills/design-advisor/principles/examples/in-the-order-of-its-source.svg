<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>In the order of its source: A shop&#x27;s card form at checkout</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A shop&#x27;s card form at checkout</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="64" font-size="11" fill="#8e8e93">Card number</text>
  <rect x="54" y="69" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="110" font-size="11" fill="#8e8e93">Expiry MM/YY</text>
  <rect x="54" y="115" width="90" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="156" font-size="11" fill="#8e8e93">Name on card</text>
  <rect x="54" y="161" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="202" font-size="11" fill="#8e8e93">Security code</text>
  <rect x="54" y="207" width="90" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="64" font-size="11" fill="#8e8e93">Name on card</text>
  <rect x="314" y="69" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="110" font-size="11" fill="#8e8e93">Expiry DD / MM / YYYY</text>
  <rect x="314" y="115" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="156" font-size="11" fill="#8e8e93">Card number</text>
  <rect x="314" y="161" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="202" font-size="11" fill="#8e8e93">Security code</text>
  <rect x="314" y="207" width="90" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: in the card&#x27;s own order, MM/YY</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: name first, expiry DD/MM/YYYY</text>
</svg>

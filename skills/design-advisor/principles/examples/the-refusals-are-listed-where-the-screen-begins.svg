<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The refusals are listed where the screen begins: A long rental application, Submit with two gaps</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A long rental application, Submit with two gaps</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="60" width="200" height="72" rx="4" fill="#fff" stroke="#ff3b30" stroke-width="3"/>
  <text x="60" y="80" font-size="13" font-weight="600" fill="#1c1c1e">There is a problem</text>
  <text x="60" y="100" font-size="11" fill="#007aff">Enter your employer</text>
  <text x="60" y="118" font-size="11" fill="#007aff">Enter your monthly income</text>
  <text x="54" y="146" font-size="11" fill="#8e8e93">Employer</text>
  <rect x="54" y="151" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1"/>
  <text x="54" y="196" font-size="11" fill="#8e8e93">Monthly income</text>
  <rect x="54" y="201" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="66" font-size="11" fill="#8e8e93">Name</text>
  <rect x="314" y="71" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="322" y="91" font-size="13" fill="#1c1c1e">Ana Ruiz</text>
  <text x="314" y="116" font-size="11" fill="#8e8e93">Employer</text>
  <rect x="314" y="121" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1"/>
  <text x="410" y="236" font-size="10" text-anchor="middle" fill="#d70015">↓ second gap below the fold</text>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: a problem box at the top, with links</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: red outlines, one below the fold</text>
</svg>

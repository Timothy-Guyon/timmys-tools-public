<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A meaning&#x27;s colour is one of the four: A weather warnings map</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A weather warnings map</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e9ecef"/>
  <circle cx="110" cy="120" r="34" fill="#ffcc00"/>
  <circle cx="120" cy="124" r="14" fill="#ff3b30"/>
  <rect x="170" y="160" width="70" height="40" rx="20" fill="#0a84ff" opacity="0.6"/>
  <text x="54" y="236" font-size="10" fill="#8e8e93">Warning</text>
  <rect x="98" y="227" width="10" height="10" fill="#ffcc00"/>
  <rect x="112" y="227" width="10" height="10" fill="#ff3b30"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#e9ecef"/>
  <circle cx="370" cy="120" r="34" fill="#30b0c7"/>
  <circle cx="380" cy="124" r="14" fill="#c69fd5"/>
  <rect x="430" y="160" width="70" height="40" rx="20" fill="#0a84ff" opacity="0.6"/>
  <text x="314" y="236" font-size="10" fill="#8e8e93">Warning</text>
  <rect x="358" y="227" width="10" height="10" fill="#30b0c7"/>
  <rect x="372" y="227" width="10" height="10" fill="#c69fd5"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: warnings yellow and red, floods blue</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: warnings in teal and mauve</text>
</svg>

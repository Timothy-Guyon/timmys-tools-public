<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Asked before anything private is sent where others may read it: A pharmacy app&#x27;s text when a prescription is ready</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A pharmacy app&#x27;s text when a prescription is ready</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#3a4a6b" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="110" width="200" height="64" rx="12" fill="rgb(255 255 255 / 0.88)"/>
  <text x="60" y="130" font-size="10" fill="#8e8e93">MESSAGES · now</text>
  <text x="60" y="152" font-size="12" font-weight="600" fill="#1c1c1e">Your prescription is ready</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#3a4a6b" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="310" y="110" width="200" height="64" rx="12" fill="rgb(255 255 255 / 0.88)"/>
  <text x="320" y="130" font-size="10" fill="#8e8e93">MESSAGES · now</text>
  <text x="320" y="150" font-size="12" font-weight="600" fill="#1c1c1e">Your sertraline 50 mg</text>
  <text x="320" y="166" font-size="12" font-weight="600" fill="#1c1c1e">is ready</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: no medicine named until asked</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: names the medicine without asking</text>
</svg>

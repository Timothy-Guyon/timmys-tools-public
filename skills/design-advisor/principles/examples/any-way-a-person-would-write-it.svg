<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Any way a person would write it: A calendar app&#x27;s new event time</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A calendar app&#x27;s new event time</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">New event</text>
  <text x="54" y="106" font-size="11" fill="#8e8e93">Starts</text>
  <rect x="54" y="111" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="131" font-size="13" fill="#1c1c1e">3pm</text>
  <text x="54" y="162" font-size="14" font-weight="600" fill="#248a3d">→ 15:00</text>
  <text x="54" y="190" font-size="11" fill="#8e8e93">Also understood: 15:00, 3.00 pm</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">New event</text>
  <text x="314" y="106" font-size="11" fill="#8e8e93">Starts</text>
  <rect x="314" y="111" width="192" height="30" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="322" y="131" font-size="13" fill="#1c1c1e">3pm</text>
  <text x="314" y="155" font-size="11" fill="#d70015">Invalid time. Use HH:MM</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: 3pm, 15:00 or 3.00 pm all work</text>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d70015">Fail: HH:MM only, told after 3pm fails</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One place, one gesture: A shop&#x27;s sideways carousel of product cards</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A shop&#x27;s sideways carousel of product cards</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Shop</text>
  <rect x="62" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="130" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="198" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="40" y="96" width="16" height="108" fill="rgb(255 59 48 / 0.12)"/>
  <text x="44" y="224" font-size="10" fill="#8e8e93">back-swipe edge</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Shop</text>
  <rect x="300" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="368" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="436" y="100" width="60" height="100" rx="8" fill="#e5e5ea"/>
  <rect x="504" y="100" width="16" height="100" fill="#e5e5ea"/>
  <rect x="300" y="96" width="16" height="108" fill="rgb(255 59 48 / 0.12)"/>
  <text x="304" y="224" font-size="10" fill="#8e8e93">back-swipe edge</text>
  <rect x="300" y="96" width="32" height="108" rx="4" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#248a3d">Pass: stops short of the back-swipe edge</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: runs to the edge, swipe leaves the page</text>
</svg>

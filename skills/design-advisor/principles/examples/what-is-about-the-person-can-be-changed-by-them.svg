<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What is about the person can be changed by them: A ride-hailing app&#x27;s profile</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A ride-hailing app&#x27;s profile</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Profile</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Name drivers see</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#007aff">Tim  Edit</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="146" font-size="14" fill="#1c1c1e">Phone</text>
  <text x="246" y="146" font-size="13" text-anchor="end" fill="#8e8e93">07700 900123</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Profile</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">Name drivers see</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">Tim</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="146" font-size="14" fill="#1c1c1e">Phone</text>
  <text x="506" y="146" font-size="13" text-anchor="end" fill="#8e8e93">07700 900123</text>
  <line x1="300" y1="158" x2="520" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="180" font-size="11" fill="#d70015">To change your name, delete</text>
  <text x="314" y="196" font-size="11" fill="#d70015">your account and sign up again.</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: the name drivers see is editable</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: only by deleting the account</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The screen shows the bones: A banking app&#x27;s accounts screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A banking app&#x27;s accounts screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Accounts</text>
  <text x="54" y="116" font-size="14" fill="#1c1c1e">Current</text>
  <text x="246" y="116" font-size="13" text-anchor="end" fill="#8e8e93">£1,240</text>
  <line x1="40" y1="128" x2="260" y2="128" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="152" font-size="14" fill="#1c1c1e">Savings</text>
  <text x="246" y="152" font-size="13" text-anchor="end" fill="#8e8e93">£3,000</text>
  <line x1="40" y1="164" x2="260" y2="164" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Accounts</text>
  <text x="314" y="116" font-size="14" fill="#1c1c1e">Total</text>
  <text x="506" y="116" font-size="13" text-anchor="end" fill="#8e8e93">£4,240</text>
  <line x1="300" y1="128" x2="520" y2="128" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="312" y="170" width="196" height="50" rx="8" fill="#fff1f0" stroke="#ffb3ad" stroke-width="1"/>
  <text x="322" y="190" font-size="12" font-weight="600" fill="#d70015">Payment refused:</text>
  <text x="322" y="208" font-size="12" fill="#d70015">savings funds unavailable</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: the two real accounts</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: one Total pot, then a refusal</text>
</svg>

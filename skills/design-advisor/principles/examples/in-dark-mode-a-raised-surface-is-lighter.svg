<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>In dark mode a raised surface is lighter: a notes app in dark mode with a sheet over the list</title>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/></filter><clipPath id="ph"><rect x="320" y="40" width="180" height="200" rx="18"/></clipPath></defs>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#1c1c1e">A notes app in dark mode, a sheet raised over the list</text>
  <!-- Pass -->
  <rect x="60" y="40" width="180" height="200" rx="18" fill="#000000"/>
  <g fill="#3a3a3c"><rect x="76" y="58" width="120" height="10" rx="5"/><rect x="76" y="80" width="90" height="10" rx="5"/><rect x="76" y="102" width="110" height="10" rx="5"/></g>
  <rect x="60" y="126" width="180" height="114" rx="18" fill="#2c2c2e"/>
  <rect x="135" y="134" width="30" height="4" rx="2" fill="#636366"/>
  <text x="76" y="166" font-size="13" font-weight="600" fill="#ffffff">New folder</text>
  <rect x="76" y="180" width="148" height="28" rx="8" fill="#3a3a3c"/>
  <!-- Fail -->
  <rect x="320" y="40" width="180" height="200" rx="18" fill="#000000"/>
  <g fill="#3a3a3c"><rect x="336" y="58" width="120" height="10" rx="5"/><rect x="336" y="80" width="90" height="10" rx="5"/><rect x="336" y="102" width="110" height="10" rx="5"/></g>
  <g clip-path="url(#ph)"><rect x="320" y="126" width="180" height="134" rx="18" fill="#000000" filter="url(#sh)"/></g>
  <rect x="395" y="134" width="30" height="4" rx="2" fill="#636366"/>
  <text x="336" y="166" font-size="13" font-weight="600" fill="#ffffff">New folder</text>
  <rect x="336" y="180" width="148" height="28" rx="8" fill="#3a3a3c"/>
  <text x="150" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: sheet is lighter,</text>
  <text x="150" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">so it reads as on top</text>
  <text x="410" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: same black + shadow,</text>
  <text x="410" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">the edge disappears</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A field&#x27;s size says how much goes in: A dentist app&#x27;s patient form</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A dentist app&#x27;s patient form</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="70" font-size="11" fill="#8e8e93">Reason for visit</text>
  <rect x="54" y="76" width="192" height="90" rx="6" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="182" font-size="11" fill="#8e8e93">Postcode</text>
  <rect x="54" y="187" width="90" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="70" font-size="11" fill="#8e8e93">Reason for visit</text>
  <rect x="314" y="76" width="90" height="30" rx="6" fill="#fff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="126" font-size="11" fill="#8e8e93">Postcode</text>
  <rect x="314" y="131" width="90" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: big box for the reason, short postcode</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: reason box as small as postcode</text>
</svg>

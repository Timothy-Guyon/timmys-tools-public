<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>What the user came for comes last: A cash machine&#x27;s withdrawal</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A cash machine&#x27;s withdrawal</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#1d3557" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="110" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">1. Take your card</text>
  <text x="150" y="140" font-size="14" text-anchor="middle" fill="#cfd8e3">2. Take your cash</text>
  <rect x="110" y="180" width="80" height="8" rx="2" fill="#000"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#1d3557" stroke="#c7c7cc" stroke-width="1"/>
  <text x="410" y="110" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">1. Take your cash</text>
  <text x="410" y="140" font-size="14" text-anchor="middle" fill="#cfd8e3">2. Take your card</text>
  <rect x="370" y="180" width="80" height="8" rx="2" fill="#000"/>
  <text x="410" y="220" font-size="11" text-anchor="middle" fill="#ff8a80">card often forgotten</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: card first, then cash</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: cash first, card left behind</text>
</svg>

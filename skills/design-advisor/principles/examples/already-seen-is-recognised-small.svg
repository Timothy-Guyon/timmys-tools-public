<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Already seen is recognised small: A music app&#x27;s Recently Played row</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A music app&#x27;s Recently Played row</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Recently Played</text>
  <rect x="54" y="100" width="28" height="28" rx="4" fill="#5e5ce6"/>
  <rect x="87" y="100" width="28" height="28" rx="4" fill="#ff9f0a"/>
  <rect x="120" y="100" width="28" height="28" rx="4" fill="#30b0c7"/>
  <rect x="153" y="100" width="28" height="28" rx="4" fill="#ff375f"/>
  <rect x="186" y="100" width="28" height="28" rx="4" fill="#34c759"/>
  <rect x="219" y="100" width="28" height="28" rx="4" fill="#af52de"/>
  <rect x="54" y="136" width="28" height="28" rx="4" fill="#5e5ce6"/>
  <rect x="87" y="136" width="28" height="28" rx="4" fill="#ff9f0a"/>
  <rect x="120" y="136" width="28" height="28" rx="4" fill="#30b0c7"/>
  <rect x="153" y="136" width="28" height="28" rx="4" fill="#ff375f"/>
  <rect x="186" y="136" width="28" height="28" rx="4" fill="#34c759"/>
  <rect x="219" y="136" width="28" height="28" rx="4" fill="#af52de"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Recently Played</text>
  <rect x="314" y="98" width="192" height="140" rx="8" fill="#5e5ce6"/>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: a dozen small covers in view</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: one full-width cover per screen</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Nothing flashes more than three times a second: A weather app&#x27;s severe storm alert</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A weather app&#x27;s severe storm alert</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Weather</text>
  <rect x="50" y="96" width="200" height="40" rx="8" fill="#ff3b30"/>
  <text x="150" y="121" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">Severe storm warning</text>
  <text x="150" y="200" font-size="30" text-anchor="middle" font-weight="600" fill="#1c1c1e">14°</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Weather</text>
  <rect x="310" y="96" width="38" height="40" rx="6" fill="#ff3b30" stroke="#ff3b30" stroke-width="1"/>
  <rect x="352" y="96" width="38" height="40" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1"/>
  <rect x="394" y="96" width="38" height="40" rx="6" fill="#ff3b30" stroke="#ff3b30" stroke-width="1"/>
  <rect x="436" y="96" width="38" height="40" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1"/>
  <rect x="478" y="96" width="38" height="40" rx="6" fill="#ff3b30" stroke="#ff3b30" stroke-width="1"/>
  <text x="410" y="154" font-size="11" text-anchor="middle" fill="#d70015">5 flashes per second</text>
  <text x="410" y="200" font-size="30" text-anchor="middle" font-weight="600" fill="#1c1c1e">14°</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: turns red once and stays</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: flashes red and white 5 times a second</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The practised hand is not slowed: A to-do list, a task ticked</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A to-do list, a task ticked</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <circle cx="64" cy="107" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="82" y="112" font-size="13" fill="#1c1c1e">Call bank</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="64" cy="141" r="9" fill="#8e8e93"/>
  <path transform="translate(40 50)" d="M20 91 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="146" font-size="13" fill="#8e8e93">Buy stamps</text>
  <line x1="82" y1="141" x2="150" y2="141" stroke="#8e8e93" stroke-width="1"/>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="64" cy="175" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="82" y="180" font-size="13" fill="#1c1c1e">Book dentist</text>
  <line x1="40" y1="192" x2="260" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="48" y="202" width="204" height="34" rx="8" fill="#1c1c1e"/>
  <text x="58" y="224" font-size="12" fill="#ffffff">Task done</text>
  <text x="242" y="224" font-size="12" text-anchor="end" font-weight="600" fill="#64d2ff">Undo</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <circle cx="324" cy="107" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="342" y="112" font-size="13" fill="#1c1c1e">Call bank</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="324" cy="141" r="9" fill="#8e8e93"/>
  <path transform="translate(300 50)" d="M20 91 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="146" font-size="13" fill="#8e8e93">Buy stamps</text>
  <line x1="342" y1="141" x2="410" y2="141" stroke="#8e8e93" stroke-width="1"/>
  <line x1="300" y1="158" x2="520" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <circle cx="324" cy="175" r="9" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="342" y="180" font-size="13" fill="#1c1c1e">Book dentist</text>
  <line x1="300" y1="192" x2="520" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="rgb(0 0 0 / 0.25)"/>
  <rect x="320" y="110" width="180" height="82" rx="12" fill="#f2f2f7"/>
  <text x="410" y="134" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">Are you sure this</text>
  <line x1="320" y1="158" x2="500" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="365" y="180" font-size="13" text-anchor="middle" fill="#007aff">Cancel</text>
  <text x="455" y="180" font-size="13" text-anchor="middle" fill="#007aff">Yes</text>
  <line x1="410" y1="158" x2="410" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="150" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">task is complete?</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: struck through, Undo for a moment</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: Are you sure? every time</text>
</svg>

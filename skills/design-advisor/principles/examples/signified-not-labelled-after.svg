<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Signified, not labelled after: A voice memo app&#x27;s recordings list</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A voice memo app&#x27;s recordings list</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Recordings</text>
  <text x="54" y="113" font-size="14" fill="#1c1c1e">Lecture 3</text>
  <line x1="40" y1="126" x2="260" y2="126" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="246" y="113" font-size="12" text-anchor="end" fill="#007aff">Share</text>
  <text x="54" y="149" font-size="14" fill="#1c1c1e">Idea</text>
  <line x1="40" y1="162" x2="260" y2="162" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="246" y="149" font-size="12" text-anchor="end" fill="#007aff">Share</text>
  <text x="54" y="185" font-size="14" fill="#1c1c1e">Interview</text>
  <line x1="40" y1="198" x2="260" y2="198" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="246" y="185" font-size="12" text-anchor="end" fill="#007aff">Share</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Recordings</text>
  <rect x="308" y="92" width="204" height="30" rx="6" fill="#fff8e1"/>
  <text x="316" y="111" font-size="11" fill="#1c1c1e">Tip: two-finger swipe to share</text>
  <text x="314" y="153" font-size="14" fill="#1c1c1e">Lecture 3</text>
  <line x1="300" y1="166" x2="520" y2="166" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="189" font-size="14" fill="#1c1c1e">Idea</text>
  <line x1="300" y1="202" x2="520" y2="202" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="225" font-size="14" fill="#1c1c1e">Interview</text>
  <line x1="300" y1="238" x2="520" y2="238" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: a Share button on each row</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: hidden two-finger swipe, tip banner</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One miss does not zero what was done: A language app the day after a missed lesson</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A language app the day after a missed lesson</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <text x="150" y="140" font-size="18" text-anchor="middle" font-weight="600" fill="#1c1c1e">99 of the last 100</text>
  <text x="150" y="162" font-size="13" text-anchor="middle" fill="#1c1c1e">days practised</text>
  <text x="150" y="194" font-size="11" text-anchor="middle" fill="#8e8e93">Current run: 0 days</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Today</text>
  <path transform="translate(300 50)" d="M110 70 C 90 100, 95 125, 110 130 C 125 125, 130 100, 110 70 Z" fill="#c7c7cc" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="210" font-size="18" text-anchor="middle" font-weight="600" fill="#8e8e93">0 days</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: 99 of the last 100 days practised</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: a grey flame and 0 days</text>
</svg>

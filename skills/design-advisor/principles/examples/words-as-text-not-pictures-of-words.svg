<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Words as text, not pictures of words: A supermarket offer with Larger Text on</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A supermarket offer with Larger Text on</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="54" y="70" width="90" height="90" rx="8" fill="#f4d35e"/>
  <text x="99" y="120" font-size="11" text-anchor="middle" fill="#8a6d00">pasta</text>
  <text x="156" y="106" font-size="22" font-weight="600" fill="#1c1c1e">3 for 2</text>
  <text x="156" y="130" font-size="18" fill="#1c1c1e">on pasta</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="314" y="70" width="192" height="90" rx="8" fill="#f4d35e"/>
  <text x="410" y="120" font-size="11" text-anchor="middle" fill="#8a6d00">pasta</text>
  <text x="330" y="90" font-size="10" font-weight="600" fill="#d70015">3 for 2 on pasta</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: text beside the photo, grows</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: words baked into the photo, stay small</text>
</svg>

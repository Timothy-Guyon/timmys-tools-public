<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Controls are read as the model: A smart fridge app&#x27;s temperature screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A smart fridge app&#x27;s temperature screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="100" cy="120" r="30" fill="none" stroke="#007aff" stroke-width="4"/>
  <text x="100" y="126" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">4°</text>
  <text x="100" y="174" font-size="12" text-anchor="middle" fill="#1c1c1e">Fridge</text>
  <circle cx="200" cy="120" r="30" fill="none" stroke="#007aff" stroke-width="4"/>
  <text x="200" y="126" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">−18°</text>
  <text x="200" y="174" font-size="12" text-anchor="middle" fill="#1c1c1e">Freezer</text>
  <text x="150" y="210" font-size="11" text-anchor="middle" fill="#8e8e93">each sets its own part</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <circle cx="360" cy="120" r="30" fill="none" stroke="#007aff" stroke-width="4"/>
  <text x="360" y="126" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">4°</text>
  <text x="360" y="174" font-size="12" text-anchor="middle" fill="#1c1c1e">Fridge</text>
  <circle cx="460" cy="120" r="30" fill="none" stroke="#007aff" stroke-width="4"/>
  <text x="460" y="126" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">−18°</text>
  <text x="460" y="174" font-size="12" text-anchor="middle" fill="#1c1c1e">Freezer</text>
  <text x="410" y="210" font-size="11" text-anchor="middle" fill="#d70015">Freezer colder → fridge 1°</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: each dial cools its own part</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: both drive one cooler, Freezer chills fridge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A time limit is the person&#x27;s to lengthen: A banking app that signs out after 5 minutes idle</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A banking app that signs out after 5 minutes idle</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Pay Sam</text>
  <text x="54" y="96" font-size="11" fill="#8e8e93">Amount</text>
  <rect x="54" y="101" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="62" y="121" font-size="13" fill="#1c1c1e">£40</text>
  <rect x="40" y="150" width="220" height="96" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="135" y="156" width="30" height="4" rx="2" fill="#c7c7cc"/>
  <text x="150" y="180" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Still there?</text>
  <text x="150" y="198" font-size="11" text-anchor="middle" fill="#8e8e93">Signing out in 1 minute</text>
  <rect x="70" y="208" width="160" height="28" rx="10" fill="#007aff"/>
  <text x="150" y="226.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Stay signed in</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Sign in</text>
  <text x="410" y="130" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">You were signed out</text>
  <text x="410" y="150" font-size="11" text-anchor="middle" fill="#d70015">Payment to Sam not saved</text>
  <rect x="330" y="190" width="160" height="30" rx="10" fill="#007aff"/>
  <text x="410" y="209.32" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">Sign in</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: Still there? at 4 minutes</text>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d70015">Fail: signed out, half-typed payment lost</text>
</svg>

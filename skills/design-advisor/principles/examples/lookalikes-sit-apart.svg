<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Lookalikes sit apart: a video call app's bottom bar with Mute and End Call</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A video call app's bottom bar</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#2c2c2e"/>
  <rect x="40" y="186" width="220" height="60" fill="#1c1c1e"/>
  <circle cx="74" cy="216" r="20" fill="#48484a"/>
  <rect x="69" y="204" width="10" height="16" rx="5" fill="#ffffff"/>
  <path d="M64 216 a10 10 0 0 0 20 0" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="74" y1="226" x2="74" y2="230" stroke="#ffffff" stroke-width="2"/>
  <rect x="196" y="200" width="52" height="32" rx="16" fill="#ff3b30"/>
  <text x="222" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">End</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#2c2c2e"/>
  <rect x="300" y="186" width="220" height="60" fill="#1c1c1e"/>
  <circle cx="388" cy="216" r="20" fill="#48484a"/>
  <circle cx="432" cy="216" r="20" fill="#48484a"/>
  <text x="388" y="221" text-anchor="middle" font-size="11" fill="#ffffff">Mute</text>
  <text x="432" y="221" text-anchor="middle" font-size="11" fill="#ffffff">End</text>
  <rect x="362" y="190" width="96" height="52" rx="26" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: far apart, unlike in look</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: side by side, same grey</text>
</svg>

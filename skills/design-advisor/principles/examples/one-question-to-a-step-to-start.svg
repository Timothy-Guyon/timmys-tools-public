<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One question to a step, to start: A car insurance quote&#x27;s first step</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A car insurance quote&#x27;s first step</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="54" y="80" font-size="14" font-weight="600" fill="#1c1c1e">When did you pass your</text>
  <text x="54" y="100" font-size="14" font-weight="600" fill="#1c1c1e">driving test?</text>
  <text x="54" y="120" font-size="11" fill="#8e8e93">Year</text>
  <rect x="54" y="125" width="192" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="60" font-size="11" fill="#8e8e93">Test passed</text>
  <rect x="314" y="65" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="106" font-size="11" fill="#8e8e93">Annual mileage</text>
  <rect x="314" y="111" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="152" font-size="11" fill="#8e8e93">Parked overnight</text>
  <rect x="314" y="157" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="198" font-size="11" fill="#8e8e93">Your job</text>
  <rect x="314" y="203" width="192" height="24" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: one question only</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: also mileage, parking and job</text>
</svg>

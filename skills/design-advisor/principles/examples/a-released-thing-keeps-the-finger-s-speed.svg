<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A released thing keeps the finger&#x27;s speed: A results sheet with three heights, a quick short flick up, animated</title>
  <desc>Animated, 4-second loop. A short quick flick up from the middle height. Left: the sheet keeps going to full height. Right: the sheet drops back to the middle.</desc>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A results sheet with three heights, a quick short flick up, animated</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cp224"><rect x="40" y="50" width="220" height="196" rx="14"/></clipPath>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <g clip-path="url(#cp224)"><g transform="translate(40 50)"><g><animateTransform attributeName="transform" type="translate" values="0 90;0 90;0 70;0 14;0 14;0 90" keyTimes="0;0.2;0.27;0.4;0.9;1" dur="4s" repeatCount="indefinite"/><rect x="0" y="0" width="220" height="200" rx="14" fill="#fff" stroke="#c7c7cc"/><rect x="95" y="6" width="30" height="4" rx="2" fill="#c7c7cc"/><text x="14" y="32" font-size="13" font-weight="600" fill="#1c1c1e">Results</text></g></g></g>
  <line x1="252" y1="64" x2="260" y2="64" stroke="#8e8e93" stroke-width="2"/>
  <line x1="252" y1="140" x2="260" y2="140" stroke="#8e8e93" stroke-width="2"/>
  <line x1="252" y1="210" x2="260" y2="210" stroke="#8e8e93" stroke-width="2"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cf224"><rect x="300" y="50" width="220" height="196" rx="14"/></clipPath>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <g clip-path="url(#cf224)"><g transform="translate(300 50)"><g><animateTransform attributeName="transform" type="translate" values="0 90;0 90;0 70;0 90;0 90;0 90" keyTimes="0;0.2;0.27;0.4;0.9;1" dur="4s" repeatCount="indefinite"/><rect x="0" y="0" width="220" height="200" rx="14" fill="#fff" stroke="#c7c7cc"/><rect x="95" y="6" width="30" height="4" rx="2" fill="#c7c7cc"/><text x="14" y="32" font-size="13" font-weight="600" fill="#1c1c1e">Results</text></g></g></g>
  <line x1="512" y1="64" x2="520" y2="64" stroke="#8e8e93" stroke-width="2"/>
  <line x1="512" y1="140" x2="520" y2="140" stroke="#8e8e93" stroke-width="2"/>
  <line x1="512" y1="210" x2="520" y2="210" stroke="#8e8e93" stroke-width="2"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: the flick carries it to full height</text>
  <text x="410" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#d70015">Fail: it falls back to the middle</text>
</svg>

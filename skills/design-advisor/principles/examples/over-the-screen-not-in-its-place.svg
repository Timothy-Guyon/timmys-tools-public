<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Over the screen, not in its place: A taxi app: tapping a car on the map</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A taxi app: tapping a car on the map</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <path transform="translate(40 50)" d="M0 40 L220 70 M60 0 L90 120" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="120" y="90" width="16" height="10" rx="2" fill="#1c1c1e"/>
  <rect x="40" y="150" width="220" height="96" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="135" y="156" width="30" height="4" rx="2" fill="#c7c7cc"/>
  <text x="54" y="180" font-size="13" font-weight="600" fill="#1c1c1e">Toyota Prius · 3 min</text>
  <text x="54" y="200" font-size="12" fill="#8e8e93">Driver: Sam, 4.9 ★</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Driver details</text>
  <text x="310" y="73" font-size="13" fill="#007aff">‹</text>
  <text x="314" y="114" font-size="14" font-weight="600" fill="#1c1c1e">Toyota Prius</text>
  <text x="314" y="136" font-size="12" fill="#8e8e93">Driver: Sam, 4.9 ★</text>
  <text x="314" y="156" font-size="12" fill="#8e8e93">3 min away</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: a sheet over the lower half, map above</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#d70015">Fail: a full page replaces the map</text>
</svg>

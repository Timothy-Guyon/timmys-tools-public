<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The frequent within reach of the holding hand: A camera app on a tall phone</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A camera app on a tall phone</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#000"/>
  <rect x="50" y="60" width="200" height="150" fill="#4a6fa5"/>
  <circle cx="150" cy="226" r="14" fill="#fff" stroke="#8e8e93" stroke-width="3"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#000"/>
  <rect x="310" y="60" width="200" height="150" fill="#4a6fa5"/>
  <circle cx="496" cy="74" r="12" fill="#fff" stroke="#8e8e93" stroke-width="3"/>
  <rect x="480" y="58" width="32" height="32" rx="16" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#248a3d">Pass: shutter at the bottom, under the thumb</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: shutter in the top corner</text>
</svg>

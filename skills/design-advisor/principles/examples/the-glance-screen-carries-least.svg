<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The glance screen carries least: A maps app&#x27;s driving view</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A maps app&#x27;s driving view</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <path transform="translate(40 50)" d="M110 196 L110 90 L180 60" fill="none" stroke="#007aff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="60" width="200" height="46" rx="10" fill="#1c7c54"/>
  <text x="62" y="90" font-size="15" font-weight="600" fill="#fff">↱ 300 m  King St</text>
  <rect x="100" y="210" width="100" height="28" rx="14" fill="#fff"/>
  <text x="150" y="229" font-size="12" text-anchor="middle" font-weight="600" fill="#1c1c1e">Arrive 14:32</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#e8eef2"/>
  <path transform="translate(300 50)" d="M110 196 L110 90 L180 60" fill="none" stroke="#007aff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="310" y="60" width="200" height="46" rx="10" fill="#1c7c54"/>
  <text x="322" y="90" font-size="15" font-weight="600" fill="#fff">↱ 300 m  King St</text>
  <rect x="306" y="180" width="66" height="60" rx="6" fill="#fff"/>
  <text x="314" y="226" font-size="9" fill="#ff9f0a">★★★★</text>
  <rect x="312" y="186" width="54" height="26" rx="3" fill="#e5e5ea"/>
  <rect x="378" y="180" width="66" height="60" rx="6" fill="#fff"/>
  <text x="386" y="226" font-size="9" fill="#ff9f0a">★★★★</text>
  <rect x="384" y="186" width="54" height="26" rx="3" fill="#e5e5ea"/>
  <rect x="450" y="180" width="66" height="60" rx="6" fill="#fff"/>
  <text x="458" y="226" font-size="9" fill="#ff9f0a">★★★★</text>
  <rect x="456" y="186" width="54" height="26" rx="3" fill="#e5e5ea"/>
  <text x="150" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">Pass: next turn, distance, arrival</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#d70015">Fail: plus a strip of restaurants and stars</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>A control sits by what it changes: A thermostat app&#x27;s room screen</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A thermostat app&#x27;s room screen</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Living room</text>
  <text x="130" y="150" font-size="36" text-anchor="middle" font-weight="600" fill="#1c1c1e">21°</text>
  <text x="130" y="170" font-size="10" text-anchor="middle" fill="#8e8e93">target</text>
  <text x="54" y="210" font-size="12" fill="#8e8e93">Humidity 45%</text>
  <rect x="190" y="112" width="40" height="28" rx="10" fill="#f2f2f7"/>
  <text x="210" y="130.32" font-size="12" text-anchor="middle" font-weight="600" fill="#1c1c1e">▲</text>
  <rect x="190" y="144" width="40" height="28" rx="10" fill="#f2f2f7"/>
  <text x="210" y="162.32" font-size="12" text-anchor="middle" font-weight="600" fill="#1c1c1e">▼</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Living room</text>
  <text x="390" y="150" font-size="36" text-anchor="middle" font-weight="600" fill="#1c1c1e">21°</text>
  <text x="390" y="170" font-size="10" text-anchor="middle" fill="#8e8e93">target</text>
  <text x="314" y="210" font-size="12" fill="#8e8e93">Humidity 45%</text>
  <rect x="420" y="218" width="40" height="24" rx="10" fill="#f2f2f7"/>
  <text x="440" y="233.96" font-size="11" text-anchor="middle" font-weight="600" fill="#1c1c1e">▲</text>
  <rect x="466" y="218" width="40" height="24" rx="10" fill="#f2f2f7"/>
  <text x="486" y="233.96" font-size="11" text-anchor="middle" font-weight="600" fill="#1c1c1e">▼</text>
  <text x="150" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#248a3d">Pass: arrows right by the 21° target</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: arrows down under humidity</text>
</svg>

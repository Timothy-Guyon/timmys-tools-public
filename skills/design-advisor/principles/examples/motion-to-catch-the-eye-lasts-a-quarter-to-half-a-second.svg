<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Motion to catch the eye lasts a quarter to half a second: A messaging app&#x27;s new-message banner, animated</title>
  <desc>Animated, 4-second loop. Left: the banner slides down once in 0.3 s and stays still. Right: the banner wiggles every two seconds.</desc>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A messaging app&#x27;s new-message banner, animated</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cp217"><rect x="40" y="50" width="220" height="196" rx="14"/></clipPath>
  <g clip-path="url(#cp217)"><g transform="translate(150 84)"><g><animateTransform attributeName="transform" type="translate" values="0 -60;0 0;0 0" keyTimes="0;0.075;1" dur="4s" repeatCount="indefinite"/><rect x="-100" y="-20" width="200" height="40" rx="10" fill="#f2f2f7"/><text x="-90" y="4" font-size="12" font-weight="600" fill="#1c1c1e">Jo: Running late</text></g></g></g>
  <text x="54" y="140" font-size="13" font-weight="600" fill="#1c1c1e">Chats</text>
  <text x="54" y="169" font-size="14" fill="#1c1c1e">Sam</text>
  <text x="54" y="184" font-size="11" fill="#8e8e93">See you then</text>
  <line x1="40" y1="190" x2="260" y2="190" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <clipPath id="cf217"><rect x="300" y="50" width="220" height="196" rx="14"/></clipPath>
  <g clip-path="url(#cf217)"><g transform="translate(410 84)"><g><animateTransform attributeName="transform" type="rotate" values="0;-6;6;-6;6;0;0;-6;6;-6;6;0;0" keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.5;0.53;0.56;0.59;0.62;0.65;1" dur="4s" repeatCount="indefinite"/><rect x="-100" y="-20" width="200" height="40" rx="10" fill="#f2f2f7"/><text x="-90" y="4" font-size="12" font-weight="600" fill="#1c1c1e">Jo: Running late</text></g></g></g>
  <text x="314" y="140" font-size="13" font-weight="600" fill="#1c1c1e">Chats</text>
  <text x="314" y="169" font-size="14" fill="#1c1c1e">Sam</text>
  <text x="314" y="184" font-size="11" fill="#8e8e93">See you then</text>
  <line x1="300" y1="190" x2="520" y2="190" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#248a3d">Pass: slides in once in 0.3 s, then still</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: wiggles every two seconds</text>
</svg>

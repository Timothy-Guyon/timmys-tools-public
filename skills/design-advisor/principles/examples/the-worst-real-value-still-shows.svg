<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The worst real value still shows: A team chat&#x27;s member list, a long name</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A team chat&#x27;s member list, a long name</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Members</text>
  <circle cx="66" cy="114" r="12" fill="#c7a17a"/>
  <text x="84" y="110" font-size="13" fill="#1c1c1e">Aleksandra</text>
  <text x="84" y="128" font-size="13" fill="#1c1c1e">Wiśniewska-Kowalczyk</text>
  <text x="246" y="118" font-size="14" text-anchor="end" fill="#007aff">•••</text>
  <line x1="40" y1="146" x2="260" y2="146" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Members</text>
  <circle cx="326" cy="114" r="12" fill="#c7a17a"/>
  <text x="344" y="118" font-size="13" fill="#1c1c1e">Aleksandra Wiśniewska-Kowa</text>
  <rect x="506" y="90" width="14" height="50" fill="#fff"/>
  <line x1="300" y1="146" x2="520" y2="146" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="276" text-anchor="middle" font-size="14.5" font-weight="600" fill="#248a3d">Pass: wraps, ••• stays at the end</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: runs on and pushes ••• off</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The platform&#x27;s way for a control: A photo app&#x27;s single-photo view</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A photo app&#x27;s single-photo view</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#000"/>
  <rect x="60" y="70" width="180" height="120" fill="#3a5a40"/>
  <circle cx="130" cy="130" r="8" fill="rgb(255 255 255 / 0.6)"/>
  <circle cx="170" cy="130" r="8" fill="rgb(255 255 255 / 0.6)"/>
  <text x="150" y="160" font-size="11" text-anchor="middle" fill="#fff">⇤ pinch ⇥</text>
  <text x="150" y="224" font-size="13" text-anchor="middle" font-weight="600" fill="#ffffff">Zooms</text>
  <text x="240" y="224" font-size="11" text-anchor="end" fill="#64d2ff">Trash</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#000"/>
  <rect x="320" y="70" width="180" height="120" fill="#3a5a40"/>
  <circle cx="390" cy="130" r="8" fill="rgb(255 255 255 / 0.6)"/>
  <circle cx="430" cy="130" r="8" fill="rgb(255 255 255 / 0.6)"/>
  <text x="410" y="160" font-size="11" text-anchor="middle" fill="#fff">⇤ pinch ⇥</text>
  <text x="410" y="224" font-size="13" text-anchor="middle" font-weight="600" fill="#ff6961">Deletes the photo</text>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: pinch zooms, trash button deletes</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: pinch deletes</text>
</svg>

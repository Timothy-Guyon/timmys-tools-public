<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>The difficult part is one part: A phone&#x27;s Settings app</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A phone&#x27;s Settings app</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M40 86 V64 a14 14 0 0 1 14 -14 H246 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="40" y1="86" x2="260" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="150" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Settings</text>
  <text x="54" y="112" font-size="14" fill="#1c1c1e">Wallpaper</text>
  <text x="246" y="112" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="146" font-size="14" fill="#1c1c1e">Sounds</text>
  <text x="246" y="146" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="54" y="180" font-size="14" fill="#ff3b30">Erase All Content</text>
  <text x="246" y="180" font-size="13" text-anchor="end" fill="#8e8e93">Passcode ›</text>
  <line x1="40" y1="192" x2="260" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <path d="M300 86 V64 a14 14 0 0 1 14 -14 H506 a14 14 0 0 1 14 14 V86 Z" fill="#f9f9f9"/>
  <line x1="300" y1="86" x2="520" y2="86" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="410" y="73" font-size="14" text-anchor="middle" font-weight="600" fill="#1c1c1e">Settings</text>
  <text x="314" y="112" font-size="14" fill="#1c1c1e">Wallpaper</text>
  <text x="506" y="112" font-size="13" text-anchor="end" fill="#8e8e93">Passcode ›</text>
  <line x1="300" y1="124" x2="520" y2="124" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="146" font-size="14" fill="#1c1c1e">Sounds</text>
  <text x="506" y="146" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="300" y1="158" x2="520" y2="158" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="180" font-size="14" fill="#ff3b30">Erase All Content</text>
  <text x="506" y="180" font-size="13" text-anchor="end" fill="#8e8e93">Passcode ›</text>
  <line x1="300" y1="192" x2="520" y2="192" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="420" y="94" width="96" height="26" rx="8" fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#248a3d">Pass: only Erase asks for the passcode</text>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#d70015">Fail: wallpaper asks for it too</text>
</svg>

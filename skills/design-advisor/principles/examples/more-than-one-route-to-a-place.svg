<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>More than one route to a place: A library app reaching one book</title>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#1c1c1e">A library app reaching one book</text>
  <!-- Pass -->
  <rect x="40" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <rect x="50" y="64" width="200" height="30" rx="10" fill="#f2f2f7"/>
  <text x="60" y="84" font-size="12" fill="#8e8e93">Search “Dune”</text>
  <text x="54" y="122" font-size="11" fill="#8e8e93">or browse</text>
  <text x="54" y="152" font-size="14" fill="#1c1c1e">Genres</text>
  <text x="246" y="152" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="40" y1="164" x2="260" y2="164" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="100" y="188" width="100" height="44" rx="6" fill="#e5e5ea"/>
  <text x="150" y="215" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">Dune</text>
  <!-- Fail -->
  <rect x="300" y="50" width="220" height="196" rx="14" fill="#ffffff" stroke="#c7c7cc" stroke-width="1"/>
  <text x="314" y="87" font-size="14" fill="#1c1c1e">Genres</text>
  <text x="506" y="87" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="300" y1="100" x2="520" y2="100" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="123" font-size="14" fill="#1c1c1e">Science fiction</text>
  <text x="506" y="123" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="300" y1="136" x2="520" y2="136" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <text x="314" y="159" font-size="14" fill="#1c1c1e">Frank Herbert</text>
  <text x="506" y="159" font-size="13" text-anchor="end" fill="#8e8e93">›</text>
  <line x1="300" y1="172" x2="520" y2="172" stroke="rgb(0 0 0 / 0.12)" stroke-width="1"/>
  <rect x="360" y="188" width="100" height="44" rx="6" fill="#e5e5ea"/>
  <text x="410" y="215" font-size="13" text-anchor="middle" font-weight="600" fill="#1c1c1e">Dune</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#248a3d">Pass: by Search or by Genres</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#d70015">Fail: only Genres › Subgenre › Author</text>
</svg>
